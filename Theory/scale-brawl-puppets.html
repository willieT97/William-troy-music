<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<title>Scale Brawl: puppet preview</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4EEE2; --ink:#17140E; --pink:#FF4E86; --gold:#FFC53D; --purple:#7B4DDB; --muted:#6F6757; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:"Space Mono",monospace; padding:16px; }
  .wrap{ max-width:820px; margin:0 auto; }
  h1{ font-family:Syne,sans-serif; font-weight:800; text-transform:uppercase; color:var(--purple); margin:0 0 4px; font-size:1.6rem; }
  p{ margin:0 0 12px; font-size:.8rem; color:var(--muted); }
  canvas{ display:block; width:100%; height:auto; aspect-ratio:760/400; border:2.5px solid var(--ink); box-shadow:6px 6px 0 var(--ink); background:#2A1E3A; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0 0; }
  button, select{ font:700 .78rem "Space Mono",monospace; text-transform:uppercase; letter-spacing:.04em; border:2px solid var(--ink);
    background:#fff; padding:7px 11px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); color:var(--ink); }
  button.on{ background:var(--gold); }
  label{ font-size:.78rem; display:inline-flex; gap:6px; align-items:center; }
  .k{ color:var(--muted); font-size:.72rem; margin-left:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Puppet preview</h1>
  <p>The fighters, built from bones (scale-brawl-puppet.js). Play a move, slow it down, show the skeleton. Pink dots are the springy parts (coat tails, hair, hood).</p>
  <canvas id="cv" width="760" height="400"></canvas>
  <div class="row" id="moves"></div>
  <div class="row">
    <label>Character <select id="who"><option value="baron">Baron</option><option value="player">Busker (you)</option><option value="rival">Rival (online)</option></select></label>
    <label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option><option value="0.1">⅒×</option></select></label>
    <button id="pause">Pause</button>
    <button id="step">Step</button>
    <label><input type="checkbox" id="bones"> Bones</label>
    <label><input type="checkbox" id="beat" checked> Beat (100 BPM)</label>
    <label>Health <input type="range" id="hp" min="0" max="100" value="100"></label>
    <span class="k" id="info"></span>
  </div>
</div>
<script src="/Theory/scale-brawl-puppet.js"></script>
<script>
(function(){
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = 760, H = 400, FLOOR = 352;
  const dpr = Math.min(2, devicePixelRatio || 1); cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const make = w => w === 'baron' ? BrawlPuppet.baron() : BrawlPuppet.busker(w);
  const q0 = new URLSearchParams(location.search), who0 = q0.get('who') || 'baron';
  document.getElementById('who').value = who0;
  let P = make(who0), P2 = make(who0), MOVES = [];
  const box = document.getElementById('moves');
  function buildMoves(){
    box.innerHTML = ''; MOVES = Object.keys(P.clips);
    MOVES.forEach(m => {
      const b = document.createElement('button'); b.textContent = m; b.dataset.m = m;
      b.onclick = () => { P.play(m); P2.play(m); mark(); };
      box.appendChild(b);
    });
  }
  buildMoves();
  document.getElementById('who').onchange = e => { P = make(e.target.value); P2 = make(e.target.value); buildMoves(); mark(); };
  const mark = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === P.state));
  mark();
  let GLOW = null;
  let speed = 1, paused = false, stepOnce = false, t = 0, last = performance.now();
  document.getElementById('speed').onchange = e => speed = +e.target.value;
  document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play' : 'Pause'; };
  document.getElementById('step').onclick = () => { paused = true; stepOnce = true; document.getElementById('pause').textContent = 'Play'; };
  addEventListener('keydown', e => { if(e.target.tagName === 'SELECT') return; const i = +e.key - 1; if(i >= 0 && i < MOVES.length){ P.play(MOVES[i]); P2.play(MOVES[i]); mark(); } });

  function bg(){
    const g = ctx.createLinearGradient(0,0,0,FLOOR); g.addColorStop(0,'#2A1E3A'); g.addColorStop(1,'#4A3466');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,FLOOR);
    ctx.fillStyle = '#B9874F'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
    ctx.strokeStyle = '#17140E'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0,FLOOR); ctx.lineTo(W,FLOOR); ctx.stroke();
    ctx.fillStyle = 'rgba(23,20,14,.3)';
    [230, 560].forEach(x => { ctx.beginPath(); ctx.ellipse(x, FLOOR+4, 50, 8, 0, 0, Math.PI*2); ctx.fill(); });
  }
  function frame(now){
    let dt = Math.min(.05, (now - last)/1000); last = now;
    if(paused && !stepOnce) dt = 0;
    if(stepOnce){ dt = 1/60; stepOnce = false; }
    dt *= speed; t += dt;
    const beatOn = document.getElementById('beat').checked;
    const inputs = {beat: beatOn ? (t*100/60) % 1 : null, hp: +document.getElementById('hp').value/100};
    P.update(dt, inputs); P2.update(dt, inputs);
    bg();
    const showBones = document.getElementById('bones').checked;
    P2.draw(ctx, 230, FLOOR, {scale:1, bones:showBones, glow: showBones ? null : GLOW});            // facing right (as built)
    P.draw(ctx, 560, FLOOR, {flip:true, scale:1, bones:showBones, glow: showBones ? null : GLOW});  // facing left (as in the game)
    if(P.m.baton){ const tip = P.point('baton', 0, 57, 560, FLOOR, {flip:true}); ctx.fillStyle = '#FFC53D'; ctx.beginPath(); ctx.arc(tip.x, tip.y, 3, 0, Math.PI*2); ctx.fill(); }
    document.getElementById('info').textContent = P.state + ' · ' + P.t.toFixed(2) + 's · ' + P.expr + ' · keys 1–' + MOVES.length;
    mark();
    requestAnimationFrame(frame);
  }
  // ?move=throw&t=0.07&bones=1 freezes a moment (handy for screenshots)
  const q = new URLSearchParams(location.search);
  if(q.get('move')){
    P.play(q.get('move')); P2.play(q.get('move'));
    const tt = +(q.get('t') || 0); for(let k = 0; k < Math.round(tt*240); k++){ P.update(1/240, {hp:1}); P2.update(1/240, {hp:1}); }
    paused = true; if(q.get('bones')) document.getElementById('bones').checked = true;
  }
  if(q.get('glow') !== '0') GLOW = 'rgba(255,197,61,.55)';
  requestAnimationFrame(frame);
  window.__P = P;
})();
</script>
</body>
</html>

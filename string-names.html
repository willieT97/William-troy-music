<!DOCTYPE html>
<html lang="en">
<head>
<script src="/analytics.js" defer></script>
<script src="/auth.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Know Your Strings — Music Arcade</title>
<meta name="description" content="Learn the open-string names of the guitar (Eddie Ate Dynamite Good Bye Eddie) and the ukulele (Good Children Eat Apples) with a saying for each, and tap any string to hear it." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF4FF; --sky2:#DCEBFF; --ink:#2A3242;
    --blue:#2E77E6; --pink:#F35D8B; --grape:#8B5CF6; --sun:#F5A623; --leaf:#28B463; --red:#E24B4B;
    --disp:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--sky); color:var(--ink); font-family:var(--body); line-height:1.55; min-height:100vh;
    background-image:radial-gradient(120% 80% at 50% -10%, var(--sky2), transparent 60%); }
  .wrap{ max-width:820px; margin:0 auto; padding:22px 18px 60px; }

  /* tabs */
  .tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:22px; }
  .tabs a{ font-family:var(--disp); font-weight:600; font-size:.82rem; letter-spacing:.02em;
    text-decoration:none; color:var(--ink); background:#fff; padding:8px 18px; border-radius:999px;
    box-shadow:0 3px 0 rgba(42,50,66,.12); }
  .tabs a.cur{ background:var(--blue); color:#fff; box-shadow:0 3px 0 #1c5bc0; }

  /* header */
  header.top{ text-align:center; margin-bottom:8px; }
  .kicker{ display:inline-block; font-family:var(--disp); font-weight:600; font-size:.8rem;
    letter-spacing:.06em; text-transform:uppercase; color:var(--grape);
    background:rgba(139,92,246,.12); padding:5px 14px; border-radius:999px; }
  h1{ font-family:var(--disp); font-weight:700; font-size:clamp(2.2rem,7vw,3.4rem);
    margin:.5rem 0 .2rem; color:var(--ink); }
  h1 .m1{ color:var(--blue); }
  .lede{ max-width:46ch; margin:.4rem auto 0; font-size:1.12rem; font-weight:600; color:#54607a; }

  /* instrument switch */
  .switch{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:24px 0 4px; }
  .switch button{ font-family:var(--disp); font-weight:600; font-size:1.05rem; cursor:pointer;
    border:none; border-radius:999px; padding:12px 26px; color:#fff; background:#aeb6c6;
    box-shadow:0 4px 0 rgba(42,50,66,.18); transition:transform .1s, opacity .15s; }
  .switch button:active{ transform:translateY(3px); box-shadow:none; }
  .switch button.on{ background:var(--blue); box-shadow:0 4px 0 #1c5bc0; }
  .switch button:not(.on){ opacity:.55; }

  /* card */
  .card{ background:#fff; border-radius:26px; padding:clamp(18px,4vw,32px);
    box-shadow:0 14px 34px rgba(42,50,66,.14); margin:22px 0 20px; }
  .sentence{ text-align:center; font-family:var(--disp); font-weight:700;
    font-size:clamp(1.3rem,4.5vw,2rem); color:var(--ink); margin:0 0 6px; line-height:1.2; }
  .sentence .first{ color:var(--blue); }
  .sub{ text-align:center; font-family:var(--disp); font-weight:500; font-size:1rem; color:#7a8398; margin:0 0 22px; }

  .strings{ display:flex; flex-direction:column; gap:12px; }
  .srow{ display:flex; align-items:center; gap:16px; cursor:pointer;
    border-radius:18px; padding:10px 12px; transition:background .12s, transform .08s;
    background:#F3F8FF; border:2px solid #dbe8fb; }
  .srow:hover{ background:#e9f2ff; }
  .srow:active{ transform:scale(.99); }
  .badge{ flex:0 0 auto; width:58px; height:58px; border-radius:16px; display:grid; place-items:center;
    font-family:var(--disp); font-weight:700; font-size:2rem; color:#fff; background:var(--blue);
    box-shadow:0 5px 0 #1c5bc0; }
  .srow .word{ font-family:var(--disp); font-weight:600; font-size:1.5rem; flex:1; }
  .srow .word .first{ color:var(--blue); text-decoration:underline; text-decoration-thickness:3px; }
  .srow .meta{ font-family:var(--disp); font-weight:500; font-size:.78rem; color:#8a93a6; text-align:right; white-space:nowrap; }
  .srow .play{ flex:0 0 auto; color:var(--sun); font-size:1.4rem; }

  .tip{ text-align:center; font-family:var(--disp); font-weight:500; font-size:1rem; color:#7a8398; margin:20px 0 2px; }
  .tip b{ color:var(--sun); }

  .foot{ margin-top:30px; text-align:center; font-family:var(--disp); font-weight:500; font-size:.95rem; }
  .foot a{ color:var(--blue); text-decoration:none; }
  .foot a:hover{ text-decoration:underline; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="wrap">

  <nav class="tabs" aria-label="Sections">
    <a href="index.html">Arcade</a>
    <a href="dojo.html">Dojo</a>
    <a href="resources.html" class="cur" aria-current="page">Resources</a>
    <a href="training.html">Training</a>
    <a href="create.html">Create</a>
  </nav>

  <header class="top">
    <span class="kicker">Strings · the names</span>
    <h1>Know Your <span class="m1">Strings</span> <span aria-hidden="true">🎸</span></h1>
    <p class="lede">Every string has a note name. A little saying helps you remember them — top string to bottom.</p>
  </header>

  <div class="switch" role="group" aria-label="Choose your instrument">
    <button data-inst="guitar" class="on">Guitar</button>
    <button data-inst="ukulele">Ukulele</button>
  </div>

  <div class="card">
    <p class="sentence" id="sentence"></p>
    <p class="sub" id="sub"></p>
    <div class="strings" id="strings"></div>
    <p class="tip">👆 <b>Tap a string</b> to hear the note it makes.</p>
  </div>

  <p class="foot"><a href="resources.html">← Back to Resources</a></p>

</div>

<script>
(function(){
  // Each instrument: the saying + one row per string, in the order the saying reads
  // (top string of the instrument down to the bottom). freq = the open-string pitch.
  var INSTS = {
    guitar: {
      name: 'Guitar', sentence: 'Eddie Ate Dynamite Good Bye Eddie',
      sub: 'Six strings, thickest (low) to thinnest (high): E · A · D · G · B · E',
      strings: [
        { note:'E', word:'Eddie',    freq: 82.41,  meta:'6th · thickest' },
        { note:'A', word:'Ate',      freq: 110.00, meta:'5th' },
        { note:'D', word:'Dynamite', freq: 146.83, meta:'4th' },
        { note:'G', word:'Good',     freq: 196.00, meta:'3rd' },
        { note:'B', word:'Bye',      freq: 246.94, meta:'2nd' },
        { note:'E', word:'Eddie',    freq: 329.63, meta:'1st · thinnest' },
      ]
    },
    ukulele: {
      name: 'Ukulele', sentence: 'Good Children Eat Apples',
      sub: 'Four strings, top to bottom: G · C · E · A',
      strings: [
        { note:'G', word:'Good',     freq: 392.00, meta:'4th · top' },
        { note:'C', word:'Children', freq: 261.63, meta:'3rd' },
        { note:'E', word:'Eat',      freq: 329.63, meta:'2nd' },
        { note:'A', word:'Apples',   freq: 440.00, meta:'1st · bottom' },
      ]
    }
  };

  // ---- sound (same gentle triangle voice as Naming the Notes) ----
  var actx = null;
  function play(freq){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      var t = actx.currentTime, osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + 1.15);
    }catch(e){}
  }

  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  function firstLetterMarked(word){
    return '<span class="first">' + esc(word[0]) + '</span>' + esc(word.slice(1));
  }

  function render(instKey){
    var I = INSTS[instKey];
    // colour the first letter of each saying word to match the string badges
    var words = I.sentence.split(' ');
    document.getElementById('sentence').innerHTML =
      words.map(function(w){ return '<span class="first">' + esc(w[0]) + '</span>' + esc(w.slice(1)); }).join(' ');
    document.getElementById('sub').textContent = I.sub;
    var host = document.getElementById('strings'); host.innerHTML = '';
    I.strings.forEach(function(s){
      var row = document.createElement('div'); row.className = 'srow';
      row.setAttribute('role','button'); row.setAttribute('tabindex','0');
      row.setAttribute('aria-label', s.word + ' — the ' + s.note + ' string. Tap to hear it.');
      row.innerHTML =
        '<span class="badge">' + esc(s.note) + '</span>' +
        '<span class="word">' + firstLetterMarked(s.word) + '</span>' +
        '<span class="meta">' + esc(s.meta) + '</span>' +
        '<span class="play" aria-hidden="true">♪</span>';
      row.addEventListener('click', function(){ play(s.freq); });
      row.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(s.freq); } });
      host.appendChild(row);
    });
  }

  document.querySelectorAll('.switch button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.switch button').forEach(function(x){ x.classList.toggle('on', x===b); });
      render(b.dataset.inst);
    });
  });

  render('guitar');
})();
</script>
</body>
</html>

<style>

  .schord{ fill:var(--ink); font-family:var(--disp); font-weight:800; transition:fill .08s; }
  .srom{ fill:var(--muted); font-family:var(--mono); transition:fill .08s; }

  /* ===== mic pitch detection (McLeod Pitch Method — same engine as the Listening Lab) ===== */
  var NOTES12=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

    for(tau=0;tau<maxLag;tau++){ var acf=0,m=0; for(i=0;i<SIZE-tau;i++){ var a=buf[i],b=buf[i+tau]; acf+=a*b; m+=a*a+b*b; } nsdf[tau]=m>0?(2*acf)/m:0; }

  var micStream=null, mAn=null, mBuf=null, micRunning=false;

    navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } }).then(function(s){
      micStream=s; var src=actx.createMediaStreamSource(s); mAn=actx.createAnalyser(); mAn.fftSize=FFT; mBuf=new Float32Array(FFT); src.connect(mAn);

    if(freq>0 && clar>=CLARITY_MIN){ var mm=freqToMidi(freq); if(heardEl) heardEl.innerHTML=NOTES12[((mm%12)+12)%12]+'<span class="oct">'+(Math.floor(mm/12)-1)+'</span>'; }

  /* ===== capstone jam: a looping C / Am groove (pentatonic sits over both) ===== */
  var jamOn=false, jamTimer=null, jamNext=0, jamBar=0;

  // 12-bar chart in slash notation (self-contained SVG): 3 rows × 4 bars, treble staff, chord symbols, a slash per beat
  function slashChartHTML(chords){
    var gap=7, staffH=4*gap, clefW=30, bw=96, topPad=26, rowH=62, totalW=clefW+4*bw, totalH=topPad+3*rowH+8, s='';
    function barline(x,y,w){ return '<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+staffH)+'" stroke="#17140E" stroke-width="'+w+'"/>'; }
    for(var row=0; row<3; row++){ var sy=topPad+row*rowH;
      for(var ln=0; ln<5; ln++){ var ly=sy+ln*gap; s+='<line x1="2" y1="'+ly+'" x2="'+(totalW-2)+'" y2="'+ly+'" stroke="#17140E" stroke-width="1.1"/>'; }

      if(row===0){ s+='<text x="'+(clefW-13)+'" y="'+(sy+2*gap)+'" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#17140E">4</text><text x="'+(clefW-13)+'" y="'+(sy+4*gap)+'" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#17140E">4</text>'; }
      s+=barline(clefW, sy, 1.4);

        for(var b=0;b<4;b++){ var cx=bx+bw*(b+0.5)/4; inner+='<line class="slash" x1="'+(cx-5)+'" y1="'+(midY+6)+'" x2="'+(cx+5)+'" y2="'+(midY-6)+'" stroke-width="3" stroke-linecap="round"/>'; }

  function checkSpace(){ var fb=el('fb');
    // group the line into runs of notes ("sentences") and rests ("breaths")
    var runs=[]; work.forEach(function(n){ var t=n.rest?'r':'n'; var last=runs[runs.length-1]; if(last && last.t===t){ last.len++; } else { runs.push({t:t,len:1}); } });
    var noteRuns=runs.filter(function(r){ return r.t==='n'; }).map(function(r){ return r.len; });
    var breaths=runs.filter(function(r){ return r.t==='r'; }).length;
    var notes=0; work.forEach(function(n){ if(!n.rest) notes++; });
    if(breaths===0){ fb.textContent='It’s wall-to-wall notes — nowhere to breathe. Play a few, then tap some out to leave a rest.'; fb.className='fb no'; return; }
    if(notes<3){ fb.textContent='You’ve hollowed it out — keep enough notes in a row to actually say a sentence between the breaths.'; fb.className='fb no'; return; }
    var longest=Math.max.apply(null, noteRuns);
    var sentences=noteRuns.filter(function(l){ return l>=2; }).length;   // runs of 2+ notes = a real idea
    var singles=noteRuns.filter(function(l){ return l===1; }).length;    // lone notes marooned between rests

    if(!isPhrase){ fb.textContent='That’s a stutter — note, gap, note, gap. Keep your notes together into one idea, THEN breathe. A sentence, then a rest.'; fb.className='fb no'; return; }

    var evs=[], inP=0, inB=0, out=0, prevT=null;
    for(var i=0;i<soloNotes.length && evs.length<24;i++){ var nt=soloNotes[i];
      if(prevT!=null){ var rb=Math.max(0, Math.min(2, Math.round((nt.t-prevT)/spb)-1)); for(var r=0;r<rb && evs.length<24;r++) evs.push({rest:true,d:1}); }
      var pc=((nt.midi%12)+12)%12, col;
      if(PENTA[pc]){ col='#1F9D55'; inP++; } else if(BLUE[pc]){ col='#2438C8'; inB++; } else { col='#C0453B'; out++; }
      evs.push({ m:nt.midi, d:1, col:col }); prevT=nt.t; }
    if(back){ back.hidden=false; back.innerHTML=renderMelody(evs); }
    var total=inP+inB+out, head;
    if(out===0) head='🎉 Every note landed in the scale'+(inB?' — with '+inB+' blue note'+(inB>1?'s':'')+' for grit':'')+'! ';
    else head='You played '+total+' notes: '+inP+' in the pentatonic'+(inB?', '+inB+' blue note'+(inB>1?'s':''):'')+', '+out+' outside. ';
    if(fb){ fb.textContent=head+'Above: green = pentatonic, blue = blue note'+(out?', red = outside — reach back into the scale next time':'')+'. Yellow belt earned — that solo was yours. 🎷'; fb.className='fb ok'; }
    onSolve(); }
  function checkEmbellish(){ var changed=0,total=0; work.forEach(function(n){ if(n.chg){ total++; if(n.m!==n.m0) changed++; } }); var fb=el('fb'); var xe=LESSONS[idx]&&LESSONS[idx].ex;
    if(total>0 && changed>=total){ fb.textContent=(xe&&xe.embWin)||'That’s YOUR version now — and because you stayed in the scale, every choice still sings. That, right there, is improvising. 🎉'; fb.className='fb ok'; onSolve(); }
    else { fb.textContent='You’ve changed '+changed+' of '+total+' — tap the highlighted notes to make the rest your own.'; fb.className='fb no'; } }
  function checkAnswer(){ var last=null; work.forEach(function(n){ if(n.chg) last=n; }); var pc=last?(((last.m%12)+12)%12):-1; var fb=el('fb');
    if(pc===0){ fb.textContent='Home. Hear how it settles? Ending on degree 1 — the tonic C — is what turns a phrase into an answer.'; fb.className='fb ok'; onSolve(); }
    else if(pc===2){ fb.textContent='Still hanging — that’s degree 2 (D), a question, not an answer. Tap the blue note home to C (degree 1).'; fb.className='fb no'; }
    else { fb.textContent='Not settled yet — tap the blue note until it lands on C, the home note (degree 1).'; fb.className='fb no'; } }
  function tradeCall(bpm){ audio(); stopPlay(); var call=genCall(), spb=60/bpm, t=actx.currentTime+0.12, beat=0;
    call.forEach(function(n){ tone(t+beat*spb, n.m, Math.max(0.14, n.d*spb*0.9)); beat+=n.d; });
    for(var k=0;k<4;k++){ click(t+(beat+k)*spb); }
    answerNotes=[]; armed=true; rmsSlow=0;
    var winStart=(t-actx.currentTime)*1000 + beat*spb*1000;   // ms from now until the answer clicks begin
    setTimeout(function(){ capturing=true; if(statusEl) statusEl.textContent='Your turn — answer, and land on C!'; }, Math.max(0,winStart));
    setTimeout(function(){ capturing=false; evalAnswer(); }, Math.max(0,winStart + 4*spb*1000 + 250)); }
  function evalAnswer(){ var fb=el('fb2'); if(!fb) return;
    if(!micRunning){ if(statusEl) statusEl.textContent='Turn on the mic to hear how you did — or just keep trading.'; return; }
    if(!answerNotes.length){ if(statusEl) statusEl.textContent='Didn’t catch your answer — play a little louder into the space.'; return; }
    var last=answerNotes[answerNotes.length-1], pc=((last.midi%12)+12)%12;
    if(pc===0){ fb.textContent='🏠 You landed home on C — that’s a real answer! Trade another, or fly on.'; fb.className='fb ok'; onSolve(); }
    else { fb.textContent='You landed on '+NOTES12[pc]+' — so close. Aim your next answer to finish on C (home).'; fb.className='fb no'; } }
  function onSolve(){ if(!solved){ solved=true; markDone(idx); renderNav(); } }

  /* ===== progress: save + sequential unlock + account sync + paywall ===== */
  var PKEY='ltf.progress.v1', COURSE_ID='learning-to-fly', PRODUCT='course:learning-to-fly';
  var FREE_LESSONS=(COURSE[0]&&COURSE[0].lessons)?COURSE[0].lessons.length:0;
  var progress=(function(){ try{ var p=JSON.parse(localStorage.getItem(PKEY)); if(p&&p.done) return p; }catch(e){} return {done:{},last:0}; })();
  function saveLocal(){ try{ localStorage.setItem(PKEY, JSON.stringify(progress)); }catch(e){} }
  function saveProgress(){ saveLocal(); cloudPush(); }
  function isDone(i){ return i>=0 && i<LESSONS.length && !!progress.done[LESSONS[i].num]; }
  function maxOpen(){ var m=0; while(m<LESSONS.length-1 && isDone(m)) m++; return m; }
  function markDone(i){ if(i<0||i>=LESSONS.length) return; var k=LESSONS[i].num; if(!progress.done[k]){ progress.done[k]=true; saveProgress(); buildToc(); } }
  function entitled(){ return !!(window.MAAuth && MAAuth.hasAccess && MAAuth.hasAccess(PRODUCT)); }
  function paywalled(i){ return i>=FREE_LESSONS && !entitled(); }
  function openCoursePaywall(){ if(window.MAAuth && MAAuth.paywall) MAAuth.paywall({ title:'This lesson is Pro', body:'Belt 1 is free. Go Pro to fly through the rest of the course — and unlock every Dojo course.', product:PRODUCT }); else location.href='/upgrade.html?highlight='+encodeURIComponent(PRODUCT); }
  function signedIn(){ return !!(window.MAAuth && MAAuth.user && MAAuth.user()); }
  var cloudReady=false;
  function cloudPush(){ if(signedIn() && cloudReady) MAAuth.progress.push(COURSE_ID, progress).catch(function(){}); }
  function cloudPull(){ if(!signedIn()){ cloudReady=false; return; }
    MAAuth.progress.pull(COURSE_ID).then(function(remote){
      if(remote && remote.done){ var wasEmpty=!Object.keys(progress.done).length;
        progress={ done:Object.assign({}, remote.done, progress.done), last:Math.max(progress.last||0, remote.last||0) }; saveLocal();
        if(wasEmpty) go(Math.min(remote.last||0, maxOpen())); else { idx=Math.min(idx,maxOpen()); buildToc(); renderNav(); } }
      cloudReady=true; MAAuth.progress.push(COURSE_ID, progress).catch(function(){});
    }).catch(function(){ cloudReady=true; }); }

  /* ===== dialogue ===== */
  function buildPages(teach){ var p=[]; teach.forEach(function(t){ if(t.t==='qa'){ p.push({who:'student',html:t.q}); p.push({who:'master',html:t.a}); } else p.push({who:'master',html:t.html}); }); return p; }
  function tokenize(html){ var t=[],i=0; while(i<html.length){ if(html[i]==='<'){ var j=html.indexOf('>',i); t.push({tag:html.slice(i,j+1)}); i=j+1; } else { t.push({ch:html[i]}); i++; } } return t; }
  function nChars(t){ var c=0; t.forEach(function(x){ if(!('tag' in x)) c++; }); return c; }
  var pages=[], pageIdx=0, dialogueDone=false, toks=[], shown=0, lineDone=false, typer=null;
  function renderType(){ var out='',c=0; toks.forEach(function(t){ if('tag' in t) out+=t.tag; else { if(c<shown) out+=t.ch; c++; } }); el('line').innerHTML=out+(lineDone?'':'<span class="cursor">▍</span>'); }
  function startType(html){ toks=tokenize(html); shown=0; lineDone=false; clearInterval(typer); renderType(); if(reduced){ finishLine(); return; } typer=setInterval(function(){ shown++; renderType(); if(shown>=nChars(toks)) finishLine(); }, 16); }
  function finishLine(){ clearInterval(typer); shown=nChars(toks); lineDone=true; renderType(); var last=pageIdx>=pages.length-1; el('cont').textContent=last?'▼ let’s play':'▼ tap to continue'; el('cont').classList.add('show'); }
  function showPage(){ var pg=pages[pageIdx]; var M=MASTERS[(LESSONS[idx]||{}).master]||MASTERS.teacher; el('scene').classList.toggle('student', pg.who==='student'); el('who').textContent=pg.who==='student'?'YOU':M.who; startType(pg.html); }
  function advance(){ if(dialogueDone) return; if(!lineDone){ finishLine(); return; } if(pageIdx<pages.length-1){ pageIdx++; showPage(); } else { dialogueDone=true; el('cont').classList.remove('show'); el('exwrap').hidden=false; } }

  /* ===== lesson / nav / toc ===== */
  function renderLesson(){ stopPlay(); stopMic(); stopJam(); stopBlues(); var L=LESSONS[idx];
    el('bk').textContent='LESSON '+L.num; el('btitle').textContent=L.title; el('belt').innerHTML='<span class="dot"></span>'+L.belt; el('pos').textContent='Lesson '+(idx+1)+' of '+LESSONS.length;
    el('portrait').innerHTML=(MASTERS[L.master]||MASTERS.teacher).svg;
    pages=buildPages(L.teach); pageIdx=0; dialogueDone=false; solved=false; work=null; el('scene').classList.remove('student');
    el('exwrap').hidden=true; el('exwrap').innerHTML=renderExercise(L.ex); wireExercise(L.ex);
    showPage(); renderNav(); buildToc(); window.scrollTo({top:0, behavior:reduced?'auto':'smooth'}); }
  function renderNav(){ el('prev').disabled=(idx===0); var L=LESSONS[idx], slot=el('nextslot');
    if(idx<LESSONS.length-1){
      if(paywalled(idx+1)){ slot.innerHTML='<button class="btn ink" id="goPro">🔒 Unlock the rest — Go Pro</button>'; el('goPro').addEventListener('click', openCoursePaywall); }
      else if(isGatedType(L.ex) && !solved && !isDone(idx)){ slot.innerHTML='<span class="endnote">Finish the exercise above, then fly on →</span>'; }
      else { slot.innerHTML='<button class="btn ink" id="next">Next →</button>'; el('next').addEventListener('click', function(){ markDone(idx); go(idx+1); }); } }
    else { slot.innerHTML='<span class="endnote">The end of the belt for now — more of the flight is being written. Come back soon.</span>'; } }
  function go(i){ i=Math.max(0,Math.min(LESSONS.length-1,i)); if(i>maxOpen()) return; if(paywalled(i)){ openCoursePaywall(); return; } idx=i; progress.last=idx; saveProgress(); renderLesson(); }
  function buildToc(){ var mo=maxOpen();
    var h=signedIn()?'<div class="synced">✓ Progress synced to your account</div>':'<div class="synced off">Saved on this device — <a id="syncSignin">sign in</a> to sync across devices</div>';
    COURSE.forEach(function(mod){ h+='<h4>'+mod.title+'</h4>';
      if(mod.lessons) mod.lessons.forEach(function(les){ var li=LESSONS.findIndex(function(x){ return x.num===les.num; });
        var done=isDone(li), pay=paywalled(li), locked=!pay && li>mo;
        var cls=[li===idx?'cur':'', pay?'pro':'', locked?'locked':'', done?'done':''].filter(Boolean).join(' ');
        var mark=done?'✓ ':(pay?'':(locked?'🔒 ':''));
        if(pay) h+='<a href="#" class="'+cls+'" data-pay="1">'+mark+les.num+' · '+les.title+'</a>';
        else if(locked) h+='<a class="'+cls+'">'+mark+les.num+' · '+les.title+'</a>';
        else h+='<a href="#" class="'+cls+'" data-go="'+li+'">'+mark+les.num+' · '+les.title+'</a>'; });
      else if(mod.soon) h+='<a class="soon">'+mod.blurb+' <span class="tag">soon</span></a>'; });
    var toc=el('toc'); toc.innerHTML=h;
    toc.querySelectorAll('[data-go]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); go(+a.dataset.go); toc.classList.add('hidden'); }); });
    toc.querySelectorAll('[data-pay]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); toc.classList.add('hidden'); openCoursePaywall(); }); });
    var si=el('syncSignin'); if(si) si.addEventListener('click', function(e){ e.preventDefault(); if(window.MAAuth && MAAuth.open) MAAuth.open('signin'); }); }

  /* ===== init ===== */
  el('speech').addEventListener('click', advance);
  el('tocBtn').addEventListener('click', function(){ el('toc').classList.toggle('hidden'); });
  el('prev').addEventListener('click', function(){ go(idx-1); });
  document.addEventListener('pointerdown', function(){ audio(); }, { once:true });
  idx=Math.min(progress.last||0, maxOpen());
  renderLesson();
  (function waitAuth(){ if(window.MAAuth && MAAuth.onChange) MAAuth.onChange(function(u){ if(u) cloudPull(); else cloudReady=false; buildToc(); }); else setTimeout(waitAuth,120); })();
  (function waitEnt(){ if(window.MAAuth && MAAuth.onEntitlements) MAAuth.onEntitlements(function(){ idx=Math.min(idx,maxOpen()); buildToc(); renderNav(); }); else setTimeout(waitEnt,120); })();
})();
</script>

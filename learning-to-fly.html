<style>
  :root{ --paper:#F4EEE2; --ink:#17140E; --card:#FFFDF7; --blue:#2438C8; --pink:#FF4E86; --green:#1F9D55; --amber:#E0922A; --muted:#6F6757;
    --disp:'Syne',sans-serif; --body:'Hanken Grotesk',sans-serif; --mono:'Space Mono',monospace; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:var(--body); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:680px; margin:0 auto; padding:22px 18px 70px; }
  header.top{ text-align:center; }
  .course{ font-family:var(--disp); font-weight:800; font-size:clamp(1.9rem,6vw,2.6rem); letter-spacing:-.02em; }
  .belt{ font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:7px; }
  .belt .dot{ display:inline-block; width:9px; height:9px; border:1.5px solid var(--ink); border-radius:50%; vertical-align:-1px; margin-right:5px; background:#fff; }
  .lessline{ display:flex; justify-content:space-between; align-items:center; margin:16px 0 10px; padding-top:14px; border-top:2px solid var(--ink); }
  #pos{ font-family:var(--mono); font-size:.64rem; letter-spacing:.06em; color:var(--muted); }
  .tocbtn{ font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; padding:7px 13px; border:2px solid var(--ink); background:var(--card); cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
  .tocbtn:active{ transform:translate(3px,3px); box-shadow:none; }
  .toc{ border:2.5px solid var(--ink); background:var(--card); padding:12px 14px; margin-bottom:18px; box-shadow:8px 8px 0 var(--ink); }
  .toc.hidden{ display:none; }
  .toc h4{ font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; } .toc h4:first-child{ margin-top:0; }
  .toc a{ display:block; font-size:.9rem; padding:5px 7px; color:var(--ink); text-decoration:none; cursor:pointer; border-left:3px solid transparent; }
  .toc a:hover{ background:rgba(36,56,200,.06); }
  .toc a.cur{ border-left-color:var(--pink); font-weight:700; background:rgba(255,78,134,.07); }
  .toc a.done{ border-left-color:var(--green); } .toc a.locked{ color:var(--muted); opacity:.55; cursor:default; } .toc a.locked:hover{ background:none; }
  .toc a.pro{ cursor:pointer; } .toc a.pro::after{ content:'PRO'; font-family:var(--mono); font-size:.5rem; font-weight:700; letter-spacing:.1em; color:#8a5a00; background:#FFE9A8; border:1px solid #8a5a00; border-radius:3px; padding:1px 5px; margin-left:7px; }
  .toc a.soon{ color:var(--muted); cursor:default; } .toc .tag{ font-family:var(--mono); font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); border:1px solid var(--amber); padding:1px 5px; margin-left:6px; }
  .synced{ font-family:var(--mono); font-size:.56rem; letter-spacing:.1em; text-transform:uppercase; color:var(--green); margin:0 0 12px; padding-bottom:10px; border-bottom:1.5px dashed rgba(23,20,14,.2); }
  .synced.off{ color:var(--muted); } .synced.off a{ color:var(--blue); text-decoration:underline; cursor:pointer; }
  .stage{ border:3px solid var(--ink); background:var(--card); box-shadow:9px 9px 0 var(--ink); padding:18px; }

  .scene{ border:2.5px solid var(--ink); border-radius:6px; background:var(--paper); padding:14px; min-height:96px; cursor:pointer; }
  .scene.student{ background:#eef1ff; }
  .who{ font-family:var(--mono); font-size:.56rem; letter-spacing:.14em; color:var(--muted); margin-bottom:6px; }
  .line{ font-size:1rem; line-height:1.5; min-height:2.6em; } .line .cursor{ color:var(--pink); }
  .cont{ font-family:var(--mono); font-size:.62rem; color:var(--blue); margin-top:8px; opacity:0; } .cont.show{ opacity:1; }
  .exwrap{ margin-top:16px; }
  .ex{ border:2.5px solid var(--ink); background:#FBF7EE; box-shadow:8px 8px 0 var(--ink); padding:16px; }
  .ex .exh{ font-family:var(--mono); font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--pink); }
  .ex .exttl{ font-family:var(--disp); font-weight:800; font-size:1.15rem; margin:2px 0 4px; }
  .ex .exd{ font-size:.92rem; color:#3a352a; margin:0 0 14px; }
  .staffwrap{ overflow-x:auto; background:#fff; border:2px solid #e4dcc9; border-radius:8px; padding:8px; margin-bottom:14px; }
  .staff{ display:block; }
  .mnote.on ellipse{ fill:var(--pink)!important; stroke:var(--pink)!important; } .mnote.on text{ fill:var(--pink); font-weight:700; }
  .mnote[data-i]:hover ellipse{ opacity:.72; } .mnote[data-i]:hover circle{ opacity:1; }
  .fb{ font-weight:700; font-size:.9rem; margin-top:12px; min-height:1.2em; } .fb.ok{ color:var(--green); } .fb.no{ color:#C0453B; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ cursor:pointer; border:2.5px solid var(--ink); border-radius:10px; background:var(--card); color:var(--ink); font-family:var(--disp); font-weight:800; font-size:.98rem; padding:10px 18px; box-shadow:3px 3px 0 var(--ink); }
  .btn:active{ transform:translate(3px,3px); box-shadow:none; } .btn[disabled]{ opacity:.5; }
  .btn.blue{ background:var(--blue); color:#fff; } .btn.ink{ background:var(--ink); color:var(--paper); }
  .nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:22px; padding-top:16px; border-top:2px solid var(--ink); }
  .nav a{ font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; color:var(--blue); text-decoration:none; }
  .endnote{ font-family:var(--mono); font-size:.62rem; color:var(--muted); text-align:right; max-width:280px; }
  .course .bird{ width:38px; height:38px; vertical-align:-7px; margin-right:8px; }
  .btn.go{ background:var(--green); color:#fff; }
  .lab{ text-align:center; border:2px solid #e4dcc9; border-radius:10px; background:#fff; padding:14px; margin-bottom:12px; }
  .lab .heard{ font-family:var(--disp); font-weight:800; font-size:2.6rem; line-height:1; } .lab .heard .oct{ font-size:1rem; color:var(--muted); vertical-align:super; }
  .lab .labstatus{ font-family:var(--mono); font-size:.68rem; letter-spacing:.04em; color:var(--muted); margin-top:6px; min-height:1em; }
  .lab.live{ border-color:var(--green); }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); font-weight:700; font-size:.9rem; padding:11px 18px; border-radius:10px; opacity:0; transition:.2s; z-index:9999; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<script>
(function(){
  var el = function(id){ return document.getElementById(id); };
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function toast(m){ var t=el('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2200); }

  /* ===== the master (Belt 1: a warm human music teacher; bird stays as the course emblem) ===== */
  var MASTER_SVG = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
    + '<ellipse cx="50" cy="95" rx="30" ry="5" fill="#17140E" opacity=".12"/>'
    + '<path d="M16 100 Q20 72 50 70 Q80 72 84 100 Z" fill="#2438C8" stroke="#17140E" stroke-width="3"/>'
    + '<path d="M42 72 L50 82 L58 72" fill="none" stroke="#17140E" stroke-width="2.4"/>'
    + '<rect x="43" y="58" width="14" height="16" rx="5" fill="#E8B183" stroke="#17140E" stroke-width="2.6"/>'
    + '<ellipse cx="50" cy="42" rx="21" ry="23" fill="#F0C29A" stroke="#17140E" stroke-width="3"/>'
    + '<path d="M28 40 Q26 16 50 16 Q74 16 72 40 Q67 28 50 28 Q33 28 28 40 Z" fill="#4a3220" stroke="#17140E" stroke-width="2.6"/>'
    + '<circle cx="41" cy="43" r="6.5" fill="#FFFDF7" stroke="#17140E" stroke-width="2"/>'
    + '<circle cx="59" cy="43" r="6.5" fill="#FFFDF7" stroke="#17140E" stroke-width="2"/>'
    + '<line x1="47.5" y1="43" x2="52.5" y2="43" stroke="#17140E" stroke-width="2"/>'
    + '<circle cx="41" cy="43" r="2.2" fill="#17140E"/><circle cx="59" cy="43" r="2.2" fill="#17140E"/>'
    + '<path d="M41 54 Q50 61 59 54" fill="none" stroke="#17140E" stroke-width="2.6" stroke-linecap="round"/>'
    + '<g transform="translate(62 86)"><circle cx="0" cy="5" r="2.6" fill="#FF4E86" stroke="#17140E" stroke-width="1.6"/><line x1="2.4" y1="5" x2="2.4" y2="-5" stroke="#17140E" stroke-width="1.6"/><path d="M2.4 -5 L7 -3.5" fill="none" stroke="#17140E" stroke-width="1.6"/></g>'
    + '</svg>';

  /* ===== melodies (key of C — midi + duration in beats) ===== */
  var MARY = [64,62,60,62, 64,64,[64,2], 62,62,[62,2], 64,67,[67,2], 64,62,60,62, 64,64,64,64, 62,62,64,62, [60,4]]
    .map(function(x){ return Array.isArray(x)?{m:x[0],d:x[1]}:{m:x,d:1}; });
  var CPENT = [60,62,64,67,69,72,69,67,64,62,[60,2]]
    .map(function(x){ return Array.isArray(x)?{m:x[0],d:x[1]}:{m:x,d:1}; });
  var MARY_EMB = MARY.map(function(n,i){ return { m:n.m, d:n.d, chg:[5,8,18,22].indexOf(i)>=0 }; });
  // call (A G E D — ends on degree 2, hangs) | answer (A G E _ — last note yours, resolve to C)
  var CR_PHRASE = [ {m:69,d:1},{m:67,d:1},{m:64,d:1},{m:62,d:1},  {m:69,d:1},{m:67,d:1},{m:64,d:1},{m:67,d:1,chg:true} ];

  /* ===== audio ===== */
  var actx=null, master=null, timers=[];
  function audio(){ if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; actx=new AC(); master=actx.createGain(); master.gain.value=0.85; master.connect(actx.destination); } if(actx.state==='suspended') actx.resume(); return actx; }
  function stopPlay(){ timers.forEach(clearTimeout); timers=[]; var on=document.querySelectorAll('.mnote.on'); for(var i=0;i<on.length;i++) on[i].classList.remove('on'); }
  function tone(t,m,dur){ var f=440*Math.pow(2,(m-69)/12); var o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.26,t+0.02); g.gain.setValueAtTime(0.26,t+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.03); }
  function hi(i){ var on=document.querySelectorAll('.mnote.on'); for(var k=0;k<on.length;k++) on[k].classList.remove('on'); var e=el('mn'+i); if(e) e.classList.add('on'); }
  function playMelody(mel, bpm){ audio(); stopPlay(); var spb=60/bpm, t=actx.currentTime+0.12, beat=0;
    mel.forEach(function(n,i){ var when=t+beat*spb; if(!n.rest) tone(when, n.m, Math.max(0.14, n.d*spb*0.9));
      timers.push(setTimeout(function(){ hi(i); }, Math.max(0,(when-actx.currentTime)*1000))); beat+=n.d; });
    timers.push(setTimeout(stopPlay, beat*spb*1000+320)); }
  function playSeq(notes, bpm){ audio(); stopPlay(); var spb=60/bpm, t=actx.currentTime+0.12, beat=0;
    notes.forEach(function(n){ if(!n.rest) tone(t+beat*spb, n.m, Math.max(0.14, n.d*spb*0.9)); beat+=n.d; }); }
  function click(t){ var o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.value=1100; o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.start(t); o.stop(t+0.06); }
  function genCall(){ var pool=[60,62,64,67,69], a=[]; for(var i=0;i<3;i++) a.push({m:pool[Math.floor(Math.random()*pool.length)],d:1}); a.push({m:62,d:2}); return a; }  // question: ends on D (degree 2)
  function playFreeCall(call, bpm){ audio(); stopPlay(); var spb=60/bpm, t=actx.currentTime+0.12, beat=0;
    call.forEach(function(n){ tone(t+beat*spb, n.m, Math.max(0.14, n.d*spb*0.9)); beat+=n.d; });
    for(var k=0;k<4;k++){ click(t+(beat+k)*spb); }   // four clicks of space for your answer
  }

  /* ===== mic pitch detection (McLeod Pitch Method — same engine as the Listening Lab) ===== */
  var NOTES12=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var FFT=2048, CLARITY_MIN=0.86, RMS_MIN=0.008, KT=0.9;
  function detectPitch(buf, sr){
    var SIZE=buf.length, rms=0, i;
    for(i=0;i<SIZE;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/SIZE);
    if(rms<RMS_MIN) return { freq:-1, clarity:0, rms:rms };
    var maxLag=SIZE>>1, nsdf=new Float32Array(maxLag), tau;
    for(tau=0;tau<maxLag;tau++){ var acf=0,m=0; for(i=0;i<SIZE-tau;i++){ var a=buf[i],b=buf[i+tau]; acf+=a*b; m+=a*a+b*b; } nsdf[tau]=m>0?(2*acf)/m:0; }
    tau=0; while(tau<maxLag-1 && nsdf[tau]>0) tau++;
    var peaks=[];
    while(tau<maxLag-1){ if(nsdf[tau]>0){ var mT=tau,mV=nsdf[tau]; while(tau<maxLag-1 && nsdf[tau]>0){ if(nsdf[tau]>mV){mV=nsdf[tau];mT=tau;} tau++; } peaks.push([mT,mV]); } else tau++; }
    if(!peaks.length) return { freq:-1, clarity:0, rms:rms };
    var gMax=0; for(i=0;i<peaks.length;i++) if(peaks[i][1]>gMax) gMax=peaks[i][1];
    var thr=KT*gMax, chosen=peaks[0];
    for(i=0;i<peaks.length;i++){ if(peaks[i][1]>=thr){ chosen=peaks[i]; break; } }
    var pt=chosen[0], bt=pt;
    if(pt>0 && pt<maxLag-1){ var x1=nsdf[pt-1],x2=nsdf[pt],x3=nsdf[pt+1],d=x1-2*x2+x3; if(d!==0) bt=pt+0.5*(x1-x3)/d; }
    return { freq: sr/bt, clarity:chosen[1], rms:rms };
  }
  function freqToMidi(f){ return Math.round(69 + 12*Math.log2(f/440)); }
  var micStream=null, mAn=null, mBuf=null, micRunning=false;
  var heardEl=null, labEl=null, statusEl=null;
  var capturing=false, answerNotes=[], armed=true, rmsSlow=0;
  function ensureMic(){
    audio(); if(micRunning) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ if(statusEl) statusEl.textContent='This browser blocks the mic — open the site over https.'; return; }
    navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } }).then(function(s){
      micStream=s; var src=actx.createMediaStreamSource(s); mAn=actx.createAnalyser(); mAn.fftSize=FFT; mBuf=new Float32Array(FFT); src.connect(mAn);
      micRunning=true; var b=el('lfMic'); if(b){ b.textContent='● Mic live'; b.classList.add('go'); } if(labEl) labEl.classList.add('live'); if(statusEl) statusEl.textContent='Listening — hear a call, then answer it.';
      requestAnimationFrame(micLoop);
    }).catch(function(err){ if(statusEl) statusEl.textContent = (err&&err.name==='NotAllowedError') ? 'Mic blocked — allow it in the address bar.' : 'Mic error — try again.'; });
  }
  function micLoop(){ if(!micRunning) return; requestAnimationFrame(micLoop); if(!mAn) return;
    mAn.getFloatTimeDomainData(mBuf); var r=detectPitch(mBuf, actx.sampleRate), freq=r.freq, rms=r.rms, clar=r.clarity;
    if(freq>0 && clar>=CLARITY_MIN){ var mm=freqToMidi(freq); if(heardEl) heardEl.innerHTML=NOTES12[((mm%12)+12)%12]+'<span class="oct">'+(Math.floor(mm/12)-1)+'</span>'; }
    var attack = rms>rmsSlow*2.4 && rms>0.03; rmsSlow=rmsSlow*0.9+rms*0.1;
    var valid = freq>0 && clar>=CLARITY_MIN && freq>60 && freq<2000;
    if(capturing && valid && armed && attack){ answerNotes.push({ midi:freqToMidi(freq) }); armed=false; }
    if(rms<0.012) armed=true;
  }
  function stopMic(){ micRunning=false; capturing=false; if(micStream){ try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} micStream=null; } mAn=null; heardEl=null; labEl=null; statusEl=null; }

  /* ===== staff renderer (treble; naturals only — Belt 1 is C major pentatonic) ===== */
  var NAT={0:0,2:1,4:2,5:3,7:4,9:5,11:6}, LET=['C','D','E','F','G','A','B'];
  function info(m){ var pc=((m%12)+12)%12, oct=Math.floor(m/12)-1, ls=NAT[pc]; if(ls==null) ls=NAT[(pc+11)%12]; return { step:oct*7+ls, name:LET[ls] }; }
  function renderMelody(mel, opts){
    opts=opts||{}; var inter=!!opts.interactive;
    var padL=44, gap=9, yBot=64, h=110, x=padL, beat=0;
    var w=padL+10; mel.forEach(function(n){ w+=Math.max(32,n.d*24); });
    var s='';
    for(var i=0;i<5;i++){ var y=yBot-i*gap; s+='<line x1="8" y1="'+y+'" x2="'+(w-8)+'" y2="'+y+'" stroke="#17140E" stroke-width="1.3"/>'; }
    s+='<text x="12" y="'+(yBot-1)+'" font-family="Georgia,serif" font-size="48" fill="#17140E">𝄞</text>';
    mel.forEach(function(n,i){
      var nf=info(n.m), y=yBot-(nf.step-30)*(gap/2), wd=Math.max(32,n.d*24), cx=x+wd/2;
      var chg=inter && n.chg, moved=chg && n.m0!=null && n.m!==n.m0;
      var col = chg ? (moved?'#1F9D55':'#2438C8') : '#17140E';
      var led=(nf.step<=28 && (30-nf.step)%2===0) ? '<line x1="'+(cx-9)+'" y1="'+y+'" x2="'+(cx+9)+'" y2="'+y+'" stroke="#17140E" stroke-width="1.3"/>' : '';
      var open=n.d>=2, stem=n.d<4;
      var head='<ellipse cx="'+cx+'" cy="'+y+'" rx="6.4" ry="4.8" transform="rotate(-18 '+cx+' '+y+')" fill="'+(open?'#FFFDF7':col)+'" stroke="'+col+'" stroke-width="'+(chg?2.4:1.7)+'"/>';
      var ring = chg ? '<circle cx="'+cx+'" cy="'+y+'" r="10.5" fill="none" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="2 2" opacity=".75"/>' : '';
      var st=stem?'<line x1="'+(cx+6)+'" y1="'+(y-1)+'" x2="'+(cx+6)+'" y2="'+(y-27)+'" stroke="'+col+'" stroke-width="1.7"/>':'';
      var lbl='<text x="'+cx+'" y="'+(h-8)+'" text-anchor="middle" font-family="\'Space Mono\',monospace" font-size="10" fill="'+(chg?col:'#6F6757')+'" font-weight="'+(chg?'700':'400')+'">'+nf.name+'</text>';
      var hit = chg ? '<rect x="'+x+'" y="6" width="'+wd+'" height="'+(h-24)+'" fill="transparent"/>' : '';
      var attr = chg ? ' data-i="'+i+'" style="cursor:pointer"' : '';
      s+='<g class="mnote" id="mn'+i+'"'+attr+'>'+hit+led+ring+head+st+lbl+'</g>';
      x+=wd; beat+=n.d;
      if(beat%4===0 && i<mel.length-1){ s+='<line x1="'+x+'" y1="'+(yBot-4*gap)+'" x2="'+x+'" y2="'+yBot+'" stroke="#17140E" stroke-width="1.3"/>'; }
    });
    return '<svg class="staff" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
  }

  /* ===== exercises ===== */
  function renderExercise(ex){
    if(ex && ex.type==='melody'){
      return '<div class="ex"><div class="exh">Listen</div><div class="exttl">'+ex.title+'</div><div class="exd">'+ex.desc+'</div>'
        + '<div class="staffwrap">'+renderMelody(ex.mel)+'</div>'
        + '<div class="row"><button class="btn blue" id="mPlay">&#9654; Play</button><button class="btn" id="mStop">Stop</button></div></div>';
    }
    if(ex && ex.type==='embellish'){
      return '<div class="ex"><div class="exh">Your turn</div><div class="exttl">'+ex.title+'</div><div class="exd">'+ex.desc+'</div>'
        + '<div class="staffwrap" id="workStaff"></div>'
        + '<div class="row"><button class="btn blue" id="mPlay">&#9654; Play</button><button class="btn" id="mStop">Stop</button><button class="btn" id="mCheck">Check</button></div>'
        + '<div class="fb" id="fb"></div></div>';
    }
    if(ex && ex.type==='answer'){
      return '<div class="ex"><div class="exh">Finish the answer</div><div class="exttl">'+ex.title+'</div><div class="exd">'+ex.desc+'</div>'
        + '<div class="staffwrap" id="workStaff"></div>'
        + '<div class="row"><button class="btn" id="mCall">&#9654; Question</button><button class="btn" id="mAns">&#9654; Your answer</button><button class="btn blue" id="mBoth">&#9654; Both</button><button class="btn" id="mCheck">Check</button></div>'
        + '<div class="fb" id="fb"></div></div>';
    }
    if(ex && ex.type==='freecall'){
      return '<div class="ex"><div class="exh">Trade with me</div><div class="exttl">'+ex.title+'</div><div class="exd">'+ex.desc+'</div>'
        + '<div class="lab" id="lfLab"><div class="heard" id="lfHeard">—</div><div class="labstatus" id="lfStatus">Enable your mic, then hear a call and answer it.</div></div>'
        + '<div class="row"><button class="btn" id="lfMic">Enable microphone</button><button class="btn blue" id="mCall">&#9654; Hear a call</button><button class="btn" id="mStop">Stop</button></div>'
        + '<div class="fb" id="fb2">Goal: after the call hangs on D, answer into the clicks and land home on C.</div>'
        + '<div class="row" style="margin-top:8px"><button class="btn ink" id="mDone">Fly on →</button></div></div>';
    }
    return '<div class="ex"><div class="exd">Coming soon.</div></div>';
  }
  function wireExercise(ex){
    if(ex && ex.type==='melody'){ el('mPlay').addEventListener('click', function(){ playMelody(ex.mel, ex.bpm||100); }); el('mStop').addEventListener('click', stopPlay); }
    if(ex && ex.type==='embellish'){
      work=ex.mel.map(function(n){ return { m:n.m, m0:n.m, d:n.d, chg:!!n.chg }; });
      drawWork('workStaff');
      el('mPlay').addEventListener('click', function(){ playMelody(work, ex.bpm||100); });
      el('mStop').addEventListener('click', stopPlay);
      el('mCheck').addEventListener('click', checkEmbellish);
    }
    if(ex && ex.type==='answer'){
      work=ex.phrase.map(function(n){ return { m:n.m, m0:n.m, d:n.d, chg:!!n.chg }; });
      drawWork('workStaff');
      el('mCall').addEventListener('click', function(){ playSeq(work.slice(0, ex.split), ex.bpm||96); });
      el('mAns').addEventListener('click', function(){ playSeq(work.slice(ex.split), ex.bpm||96); });
      el('mBoth').addEventListener('click', function(){ playSeq(work, ex.bpm||96); });
      el('mCheck').addEventListener('click', checkAnswer);
    }
    if(ex && ex.type==='freecall'){
      heardEl=el('lfHeard'); labEl=el('lfLab'); statusEl=el('lfStatus');
      el('lfMic').addEventListener('click', ensureMic);
      el('mCall').addEventListener('click', function(){ tradeCall(ex.bpm||88); });
      el('mStop').addEventListener('click', function(){ stopPlay(); capturing=false; });
      el('mDone').addEventListener('click', function(){ var fb=el('fb2'); if(fb){ fb.textContent='Nice trading — that’s call and response. Fly on when you’re ready.'; fb.className='fb ok'; } onSolve(); });
    }
  }

  /* ===== course ===== */
  var COURSE = [
    { title:'Belt 1 — Melody & the Pentatonic', belt:'White Belt', lessons:[
      { num:'1.1', title:'A melody you already know', teach:[
          { html:"Welcome, little flyer. Before scales, before theory — you already carry melodies in your bones. Let's start with one everybody knows: <b>Mary Had a Little Lamb</b>." },
          { html:"Hit <b>Play</b> and just listen. Hear how it rises, falls, and <em>rests</em>. That shape is melody — and improvising begins right here, not with strange new notes but with a tune you can already hum." },
          { t:'qa', q:"That's it? A nursery rhyme?", a:"That's it. Every good solo is just a melody you invent as you go. Learn to hear a tune and bend it, and you're already flying. Give it a few listens." }
        ], ex:{ type:'melody', title:'Mary Had a Little Lamb', mel:MARY, bpm:100,
          desc:'Press Play and follow the note that lights up. This is our home melody for the whole belt. The letters under each note tell you its name.' } },
      { num:'1.2', title:'The major pentatonic', teach:[
          { html:"Here's the secret hiding in that tune: it uses only <b>five</b> notes. Gather them, line them up, and you have the <b>major pentatonic scale</b>." },
          { html:"In the key of C those five are <b>C · D · E · G · A</b>. No note in there can truly clash with another — which makes it the safest, sweetest sandbox in all of music to start improvising in." },
          { html:"Play the scale below and listen. Then play Mary again — <em>every</em> note she sings is one of these five. The melody was living inside the scale the whole time." }
        ], ex:{ type:'melody', title:'C major pentatonic', mel:CPENT, bpm:120,
          desc:'Five notes: C D E G A (then C on top and back down). Play it up and down until it sits in your ear.' } },
      { num:'1.3', title:'Make it your own', teach:[
          { html:"Time to <b>fly</b> a little. You know Mary, and you know she lives in the pentatonic. So here's the leap: change a few of her notes — to <em>other</em> notes in the scale — and she'll still sound good. That's the whole magic of the pentatonic." },
          { html:"On the staff below, four notes glow <b>blue</b> — those are yours. Tap one and it hops to the next note in the pentatonic; keep tapping to try them all. Each tap plays it, so you can hear your choice." },
          { t:'qa', q:"But what if I pick a bad one?", a:"There are no bad ones here — that's the point of the pentatonic sandbox. All five work. Change all four blue notes, hit Play, and listen to a melody that's now a little bit <em>yours</em>." }
        ], ex:{ type:'embellish', title:'Make it your own', mel:MARY_EMB, bpm:100,
          desc:'The four blue notes are yours — tap each to move it to another pentatonic note (it plays as you tap). Change all four, then Play the whole tune and hear your version.' } },
      { num:'1.4', title:'Call & response', teach:[
          { html:"Music is a conversation. One phrase asks a <b>question</b>, the next gives an <b>answer</b> — that back-and-forth is <b>call and response</b>, the heartbeat of the blues, of jazz, of all of it." },
          { html:"Here's the trick that makes it feel like real Q&A. The <b>question</b> leaves you hanging — it ends on <b>degree 2</b> (in C, that's <b>D</b>), a note that sounds unfinished. The <b>answer</b> comes <b>home</b> — it ends on <b>degree 1</b>, the tonic <b>C</b>." },
          { t:'qa', q:"Just the last note matters that much?", a:"The last note does the heavy lifting. Land on the 2 and the ear leans in for more; land on the 1 and it's settled. Below, my question hangs on D — finish the answer so it lands home on C." }
        ], ex:{ type:'answer', title:'Land it home', phrase:CR_PHRASE, split:4, bpm:96,
          desc:'Bar 1 is my question — it ends on D and hangs. Bar 2 is your answer, and its last note is blue. Tap it until the whole thing lands home on C (degree 1), then hear Both.' } },
      { num:'1.5', title:'Answer me', teach:[
          { html:"Now we play for real. I'll ask a question — you won't see the notes, you'll just <em>hear</em> it. Then it's your turn: answer out loud, on your instrument, into the space." },
          { html:"No grading here, no wrong notes to fear — you've got the pentatonic, so you truly can't miss. One aim only: after my question hangs on the <b>2</b>, bring your answer <b>home to the 1</b> (C)." },
          { t:'qa', q:"And if my answer's rubbish?", a:"Then you call up another question and answer again — that's how every player who ever lived learned to talk. Trade a few with me, and when it feels natural, fly on." }
        ], ex:{ type:'freecall', title:'Trade fours', bpm:88,
          desc:'Turn on your mic, then tap “Hear a call” — a question you can’t see, ending on D. Answer it on your instrument in the four clicks that follow, landing home on C. The lab listens and cheers when you make it home. Wired headphones help.' } }
    ]},
    { title:'Belt 2 — The Blues', belt:'Yellow Belt', soon:true, blurb:'Add the blue note and take your first solo over a 12-bar blues.' }
  ];
  var LESSONS=[]; COURSE.forEach(function(mod){ if(mod.lessons) mod.lessons.forEach(function(les){ LESSONS.push(Object.assign({ belt:mod.belt }, les)); }); });
  var idx=0, solved=false, work=null;
  var PSET=[60,62,64,67,69,72];   // C major pentatonic across the melody's range
  function isGatedType(ex){ return !!ex && (ex.type==='embellish' || ex.type==='answer' || ex.type==='freecall'); }
  function playOne(m){ audio(); tone(actx.currentTime+0.02, m, 0.5); }
  function cyclePitch(i){ var n=work[i]; var ci=PSET.indexOf(n.m); if(ci<0) ci=0; n.m=PSET[(ci+1)%PSET.length]; }
  function drawWork(cid){ var c=el(cid); c.innerHTML=renderMelody(work, {interactive:true});
    c.querySelectorAll('[data-i]').forEach(function(g){ g.addEventListener('click', function(){ var i=+g.dataset.i; cyclePitch(i); playOne(work[i].m); drawWork(cid); }); }); }
  function checkEmbellish(){ var changed=0,total=0; work.forEach(function(n){ if(n.chg){ total++; if(n.m!==n.m0) changed++; } }); var fb=el('fb');
    if(changed>=total){ fb.textContent='That’s YOUR Mary now — and because you stayed in the pentatonic, every choice still sings. That, right there, is improvising. 🎉'; fb.className='fb ok'; onSolve(); }
    else { fb.textContent='You’ve changed '+changed+' of '+total+' — tap the blue notes to make the rest your own.'; fb.className='fb no'; } }
  function checkAnswer(){ var last=null; work.forEach(function(n){ if(n.chg) last=n; }); var pc=last?(((last.m%12)+12)%12):-1; var fb=el('fb');
    if(pc===0){ fb.textContent='Home. Hear how it settles? Ending on degree 1 — the tonic C — is what turns a phrase into an answer.'; fb.className='fb ok'; onSolve(); }
    else if(pc===2){ fb.textContent='Still hanging — that’s degree 2 (D), a question, not an answer. Tap the blue note home to C (degree 1).'; fb.className='fb no'; }
    else { fb.textContent='Not settled yet — tap the blue note until it lands on C, the home note (degree 1).'; fb.className='fb no'; } }
  function tradeCall(bpm){ audio(); stopPlay(); var call=genCall(), spb=60/bpm, t=actx.currentTime+0.12, beat=0;
    call.forEach(function(n){ tone(t+beat*spb, n.m, Math.max(0.14, n.d*spb*0.9)); beat+=n.d; });
    for(var k=0;k<4;k++){ click(t+(beat+k)*spb); }
    answerNotes=[]; armed=true; rmsSlow=0;
    var winStart=(t-actx.currentTime)*1000 + beat*spb*1000;   // ms from now until the answer clicks begin
    setTimeout(function(){ capturing=true; if(statusEl) statusEl.textContent='Your turn — answer, and land on C!'; }, Math.max(0,winStart));
    setTimeout(function(){ capturing=false; evalAnswer(); }, Math.max(0,winStart + 4*spb*1000 + 250)); }
  function evalAnswer(){ var fb=el('fb2'); if(!fb) return;
    if(!micRunning){ if(statusEl) statusEl.textContent='Turn on the mic to hear how you did — or just keep trading.'; return; }
    if(!answerNotes.length){ if(statusEl) statusEl.textContent='Didn’t catch your answer — play a little louder into the space.'; return; }
    var last=answerNotes[answerNotes.length-1], pc=((last.midi%12)+12)%12;
    if(pc===0){ fb.textContent='🏠 You landed home on C — that’s a real answer! Trade another, or fly on.'; fb.className='fb ok'; onSolve(); }
    else { fb.textContent='You landed on '+NOTES12[pc]+' — so close. Aim your next answer to finish on C (home).'; fb.className='fb no'; } }
  function onSolve(){ if(!solved){ solved=true; markDone(idx); renderNav(); } }

  /* ===== progress: save + sequential unlock + account sync + paywall ===== */
  var PKEY='ltf.progress.v1', COURSE_ID='learning-to-fly', PRODUCT='course:learning-to-fly';
  var FREE_LESSONS=(COURSE[0]&&COURSE[0].lessons)?COURSE[0].lessons.length:0;
  var progress=(function(){ try{ var p=JSON.parse(localStorage.getItem(PKEY)); if(p&&p.done) return p; }catch(e){} return {done:{},last:0}; })();
  function saveLocal(){ try{ localStorage.setItem(PKEY, JSON.stringify(progress)); }catch(e){} }
  function saveProgress(){ saveLocal(); cloudPush(); }
  function isDone(i){ return i>=0 && i<LESSONS.length && !!progress.done[LESSONS[i].num]; }
  function maxOpen(){ var m=0; while(m<LESSONS.length-1 && isDone(m)) m++; return m; }
  function markDone(i){ if(i<0||i>=LESSONS.length) return; var k=LESSONS[i].num; if(!progress.done[k]){ progress.done[k]=true; saveProgress(); buildToc(); } }
  function entitled(){ return !!(window.MAAuth && MAAuth.hasAccess && MAAuth.hasAccess(PRODUCT)); }
  function paywalled(i){ return i>=FREE_LESSONS && !entitled(); }
  function openCoursePaywall(){ if(window.MAAuth && MAAuth.paywall) MAAuth.paywall({ title:'This lesson is Pro', body:'Belt 1 is free. Go Pro to fly through the rest of the course — and unlock every Dojo course.', product:PRODUCT }); else location.href='/upgrade.html?highlight='+encodeURIComponent(PRODUCT); }
  function signedIn(){ return !!(window.MAAuth && MAAuth.user && MAAuth.user()); }
  var cloudReady=false;
  function cloudPush(){ if(signedIn() && cloudReady) MAAuth.progress.push(COURSE_ID, progress).catch(function(){}); }
  function cloudPull(){ if(!signedIn()){ cloudReady=false; return; }
    MAAuth.progress.pull(COURSE_ID).then(function(remote){
      if(remote && remote.done){ var wasEmpty=!Object.keys(progress.done).length;
        progress={ done:Object.assign({}, remote.done, progress.done), last:Math.max(progress.last||0, remote.last||0) }; saveLocal();
        if(wasEmpty) go(Math.min(remote.last||0, maxOpen())); else { idx=Math.min(idx,maxOpen()); buildToc(); renderNav(); } }
      cloudReady=true; MAAuth.progress.push(COURSE_ID, progress).catch(function(){});
    }).catch(function(){ cloudReady=true; }); }

  /* ===== dialogue ===== */
  function buildPages(teach){ var p=[]; teach.forEach(function(t){ if(t.t==='qa'){ p.push({who:'student',html:t.q}); p.push({who:'master',html:t.a}); } else p.push({who:'master',html:t.html}); }); return p; }
  function tokenize(html){ var t=[],i=0; while(i<html.length){ if(html[i]==='<'){ var j=html.indexOf('>',i); t.push({tag:html.slice(i,j+1)}); i=j+1; } else { t.push({ch:html[i]}); i++; } } return t; }
  function nChars(t){ var c=0; t.forEach(function(x){ if(!('tag' in x)) c++; }); return c; }
  var pages=[], pageIdx=0, dialogueDone=false, toks=[], shown=0, lineDone=false, typer=null;
  function renderType(){ var out='',c=0; toks.forEach(function(t){ if('tag' in t) out+=t.tag; else { if(c<shown) out+=t.ch; c++; } }); el('line').innerHTML=out+(lineDone?'':'<span class="cursor">▍</span>'); }
  function startType(html){ toks=tokenize(html); shown=0; lineDone=false; clearInterval(typer); renderType(); if(reduced){ finishLine(); return; } typer=setInterval(function(){ shown++; renderType(); if(shown>=nChars(toks)) finishLine(); }, 16); }
  function finishLine(){ clearInterval(typer); shown=nChars(toks); lineDone=true; renderType(); var last=pageIdx>=pages.length-1; el('cont').textContent=last?'▼ let’s play':'▼ tap to continue'; el('cont').classList.add('show'); }
  function showPage(){ var pg=pages[pageIdx]; el('scene').classList.toggle('student', pg.who==='student'); el('who').textContent=pg.who==='student'?'YOU':'YOUR TEACHER'; startType(pg.html); }
  function advance(){ if(dialogueDone) return; if(!lineDone){ finishLine(); return; } if(pageIdx<pages.length-1){ pageIdx++; showPage(); } else { dialogueDone=true; el('cont').classList.remove('show'); el('exwrap').hidden=false; } }

  /* ===== lesson / nav / toc ===== */
  function renderLesson(){ stopPlay(); stopMic(); var L=LESSONS[idx];
    el('bk').textContent='LESSON '+L.num; el('btitle').textContent=L.title; el('belt').innerHTML='<span class="dot"></span>'+L.belt; el('pos').textContent='Lesson '+(idx+1)+' of '+LESSONS.length;
    el('portrait').innerHTML=MASTER_SVG;
    pages=buildPages(L.teach); pageIdx=0; dialogueDone=false; solved=false; work=null; el('scene').classList.remove('student');
    el('exwrap').hidden=true; el('exwrap').innerHTML=renderExercise(L.ex); wireExercise(L.ex);
    showPage(); renderNav(); buildToc(); window.scrollTo({top:0, behavior:reduced?'auto':'smooth'}); }
  function renderNav(){ el('prev').disabled=(idx===0); var L=LESSONS[idx], slot=el('nextslot');
    if(idx<LESSONS.length-1){
      if(paywalled(idx+1)){ slot.innerHTML='<button class="btn ink" id="goPro">🔒 Unlock the rest — Go Pro</button>'; el('goPro').addEventListener('click', openCoursePaywall); }
      else if(isGatedType(L.ex) && !solved && !isDone(idx)){ slot.innerHTML='<span class="endnote">Finish the exercise above, then fly on →</span>'; }
      else { slot.innerHTML='<button class="btn ink" id="next">Next →</button>'; el('next').addEventListener('click', function(){ markDone(idx); go(idx+1); }); } }
    else { slot.innerHTML='<span class="endnote">The end of the belt for now — more of the flight is being written. Come back soon.</span>'; } }
  function go(i){ i=Math.max(0,Math.min(LESSONS.length-1,i)); if(i>maxOpen()) return; if(paywalled(i)){ openCoursePaywall(); return; } idx=i; progress.last=idx; saveProgress(); renderLesson(); }
  function buildToc(){ var mo=maxOpen();
    var h=signedIn()?'<div class="synced">✓ Progress synced to your account</div>':'<div class="synced off">Saved on this device — <a id="syncSignin">sign in</a> to sync across devices</div>';
    COURSE.forEach(function(mod){ h+='<h4>'+mod.title+'</h4>';
      if(mod.lessons) mod.lessons.forEach(function(les){ var li=LESSONS.findIndex(function(x){ return x.num===les.num; });
        var done=isDone(li), pay=paywalled(li), locked=!pay && li>mo;
        var cls=[li===idx?'cur':'', pay?'pro':'', locked?'locked':'', done?'done':''].filter(Boolean).join(' ');
        var mark=done?'✓ ':(pay?'':(locked?'🔒 ':''));
        if(pay) h+='<a href="#" class="'+cls+'" data-pay="1">'+mark+les.num+' · '+les.title+'</a>';
        else if(locked) h+='<a class="'+cls+'">'+mark+les.num+' · '+les.title+'</a>';
        else h+='<a href="#" class="'+cls+'" data-go="'+li+'">'+mark+les.num+' · '+les.title+'</a>'; });
      else if(mod.soon) h+='<a class="soon">'+mod.blurb+' <span class="tag">soon</span></a>'; });
    var toc=el('toc'); toc.innerHTML=h;
    toc.querySelectorAll('[data-go]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); go(+a.dataset.go); toc.classList.add('hidden'); }); });
    toc.querySelectorAll('[data-pay]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); toc.classList.add('hidden'); openCoursePaywall(); }); });
    var si=el('syncSignin'); if(si) si.addEventListener('click', function(e){ e.preventDefault(); if(window.MAAuth && MAAuth.open) MAAuth.open('signin'); }); }

  /* ===== init ===== */
  el('speech').addEventListener('click', advance);
  el('tocBtn').addEventListener('click', function(){ el('toc').classList.toggle('hidden'); });
  el('prev').addEventListener('click', function(){ go(idx-1); });
  document.addEventListener('pointerdown', function(){ audio(); }, { once:true });
  idx=Math.min(progress.last||0, maxOpen());
  renderLesson();
  (function waitAuth(){ if(window.MAAuth && MAAuth.onChange) MAAuth.onChange(function(u){ if(u) cloudPull(); else cloudReady=false; buildToc(); }); else setTimeout(waitAuth,120); })();
  (function waitEnt(){ if(window.MAAuth && MAAuth.onEntitlements) MAAuth.onEntitlements(function(){ idx=Math.min(idx,maxOpen()); buildToc(); renderNav(); }); else setTimeout(waitEnt,120); })();
})();
</script>

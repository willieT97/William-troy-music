<style>
  :root{ --paper:#F4EEE2; --ink:#17140E; --card:#FFFDF7; --blue:#2438C8; --pink:#FF4E86; --green:#1F9D55; --amber:#E0922A; --muted:#6F6757;
    --disp:'Syne',sans-serif; --body:'Hanken Grotesk',sans-serif; --mono:'Space Mono',monospace; }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:var(--body); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; }

  @media(max-width:760px){ header.top{ padding-top:calc(var(--maa-ctl-h, 32px) + 4px); } }
  .course{ font-family:var(--disp); font-weight:800; font-size:clamp(1.9rem,6vw,2.6rem); letter-spacing:-.02em; }

  .belt .dot{ display:inline-block; width:9px; height:9px; border:1.5px solid var(--ink); border-radius:50%; vertical-align:-1px; margin-right:5px; background:#fff; }
  .lessline{ display:flex; justify-content:space-between; align-items:center; margin:16px 0 10px; padding-top:14px; border-top:2px solid var(--ink); }
  #pos{ font-family:var(--mono); font-size:.64rem; letter-spacing:.06em; color:var(--muted); }
  .tocbtn{ font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; padding:7px 13px; border:2px solid var(--ink); background:var(--card); cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
  .tocbtn:active{ transform:translate(3px,3px); box-shadow:none; }
  .toc{ border:2.5px solid var(--ink); background:var(--card); padding:12px 14px; margin-bottom:18px; box-shadow:8px 8px 0 var(--ink); }
  .toc.hidden{ display:none; }
  .toc h4{ font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; } .toc h4:first-child{ margin-top:0; }
  .toc a{ display:block; font-size:.9rem; padding:5px 7px; color:var(--ink); text-decoration:none; cursor:pointer; border-left:3px solid transparent; }
  .toc a:hover{ background:rgba(36,56,200,.06); }
  .toc a.cur{ border-left-color:var(--pink); font-weight:700; background:rgba(255,78,134,.07); }
  .toc a.done{ border-left-color:var(--green); } .toc a.locked{ color:var(--muted); opacity:.55; cursor:default; } .toc a.locked:hover{ background:none; }
  .toc a.pro{ cursor:pointer; } .toc a.pro::after{ content:'PRO'; font-family:var(--mono); font-size:.5rem; font-weight:700; letter-spacing:.1em; color:#8a5a00; background:#FFE9A8; border:1px solid #8a5a00; border-radius:3px; padding:1px 5px; margin-left:7px; }
  .toc a.soon{ color:var(--muted); cursor:default; } .toc .tag{ font-family:var(--mono); font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); border:1px solid var(--amber); padding:1px 5px; margin-left:6px; }

  .synced.off{ color:var(--muted); } .synced.off a{ color:var(--blue); text-decoration:underline; cursor:pointer; }

  .portrait{ width:96px; margin:0 auto 6px; } .portrait svg{ width:100%; height:auto; display:block; }
  .lesson-h{ text-align:center; } .bk{ font-family:var(--mono); font-size:.6rem; letter-spacing:.16em; color:var(--pink); }
  .lesson-h h2{ font-family:var(--disp); font-weight:800; font-size:1.4rem; margin:.15rem 0 12px; }
  .scene{ border:2.5px solid var(--ink); border-radius:6px; background:var(--paper); padding:14px; min-height:96px; cursor:pointer; }
  .scene.student{ background:#eef1ff; }
  .who{ font-family:var(--mono); font-size:.56rem; letter-spacing:.14em; color:var(--muted); margin-bottom:6px; }
  .line{ font-size:1rem; line-height:1.5; min-height:2.6em; } .line .cursor{ color:var(--pink); }
  .cont{ font-family:var(--mono); font-size:.62rem; color:var(--blue); margin-top:8px; opacity:0; } .cont.show{ opacity:1; }
  .exwrap{ margin-top:16px; }
  .ex{ border:2.5px solid var(--ink); background:#FBF7EE; box-shadow:8px 8px 0 var(--ink); padding:16px; }
  .ex .exh{ font-family:var(--mono); font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--pink); }
  .ex .exttl{ font-family:var(--disp); font-weight:800; font-size:1.15rem; margin:2px 0 4px; }
  .ex .exd{ font-size:.92rem; color:#3a352a; margin:0 0 14px; }

  .staff{ display:block; }
  .mnote.on ellipse{ fill:var(--pink)!important; stroke:var(--pink)!important; } .mnote.on text{ fill:var(--pink); font-weight:700; }

  .exd a{ color:var(--blue); font-weight:700; }

  .btn{ cursor:pointer; border:2.5px solid var(--ink); border-radius:10px; background:var(--card); color:var(--ink); font-family:var(--disp); font-weight:800; font-size:.98rem; padding:10px 18px; box-shadow:3px 3px 0 var(--ink); }

  .nav a{ font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; color:var(--blue); text-decoration:none; }
  .endnote{ font-family:var(--mono); font-size:.62rem; color:var(--muted); text-align:right; max-width:280px; }
  .course .bird{ width:38px; height:38px; vertical-align:-7px; margin-right:8px; }
  .btn.go{ background:var(--green); color:#fff; }
  .lab{ text-align:center; border:2px solid #e4dcc9; border-radius:10px; background:#fff; padding:14px; margin-bottom:12px; }
  .lab .heard{ font-family:var(--disp); font-weight:800; font-size:2.6rem; line-height:1; } .lab .heard .oct{ font-size:1rem; color:var(--muted); vertical-align:super; }

  .btn.sm{ font-family:var(--body); font-weight:800; font-size:.82rem; padding:7px 12px; box-shadow:2px 2px 0 var(--ink); }

  .crmary{ font-size:.85rem; color:var(--muted); margin-bottom:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .slashwrap{ background:#fff; border:2px solid #e4dcc9; border-radius:10px; padding:12px 10px; margin-bottom:12px; overflow-x:auto; }
  .slashsvg{ display:block; min-width:340px; }
  .slash{ stroke:var(--ink); transition:stroke .08s; }
  .schord{ fill:var(--ink); font-family:var(--disp); font-weight:800; transition:fill .08s; }
  .srom{ fill:var(--muted); font-family:var(--mono); transition:fill .08s; }
  .sbg{ fill:transparent; transition:fill .08s; }
  .sbar.on .sbg{ fill:rgba(36,56,200,.12); }

  .sbar.on .schord, .sbar.on .srom{ fill:var(--blue); }
  .scaleref{ font-size:.85rem; color:var(--muted); margin-bottom:12px; } .scaleref .reflbl{ font-weight:700; color:var(--ink); }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); font-weight:700; font-size:.9rem; padding:11px 18px; border-radius:10px; opacity:0; transition:.2s; z-index:9999; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>

  // chord chart in slash notation (self-contained SVG): 4 bars a row, treble staff, chord symbols, a slash per beat
  function slashChartHTML(chords, roman){

  /* ===== staff renderer (treble; naturals only — Belt 1 is C major pentatonic) ===== */

        el('keyPick').innerHTML=ex.keys.map(function(k,j){ return '<button class="btn sm'+(j===kcur?' blue':'')+'" data-k="'+j+'">'+(kdone[k.name]?'✓ ':'')+(k.label||('Key of '+k.name))+'</button>'; }).join('');
        el('keyPick').querySelectorAll('[data-k]').forEach(function(b){ b.addEventListener('click', function(){ selectKey(+b.dataset.k); }); });
        var fb=el('fb'), left=ex.keys.filter(function(k){ return !kdone[k.name]; }).length;
        if(!left){ fb.textContent=ex.allDone||'All five keys — same stairs, five front doors. Wherever the fiddler calls it, you’ve got the run. 🪕'; fb.className='fb ok'; onSolve(); }
        else if(!quiet){ fb.textContent=(total-left)+' of '+total+' — keep going round.'; fb.className='fb no'; }
      };
      selectKey(0, true);
      el('mPlay').addEventListener('click', function(){ selectKey(kcur); });
      el('mStop').addEventListener('click', stopPlay);
    }
    if(ex && ex.type==='bluesjam'){
      el('bluesGrid').innerHTML=slashChartHTML(ex.chords, ex.roman);
      if(ex.mic){ heardEl=el('lfHeard'); labEl=el('lfLab'); statusEl=el('lfStatus'); el('lfMic').addEventListener('click', function(){ ensureMic(); soloCapturing=true; }); }
      el('bPlay').addEventListener('click', function(){ if(ex.mic){ soloNotes=[]; soloCapturing=true; var b=el('soloBack'); if(b){ b.hidden=true; b.innerHTML=''; } var cb=el('mCarveCheck'), cp=el('mCarvePlay'); if(cb) cb.hidden=true; if(cp) cp.hidden=true; } startBlues(ex.chords, ex.bpm||96); });
      el('bStop').addEventListener('click', function(){ stopBlues(); });
      el('mDone').addEventListener('click', function(){ stopBlues();
        if(ex.checkMode==='carve'){
          if(!soloNotes.length && !micRunning){ var fbc=el('fb2'); if(fbc){ fbc.textContent=ex.win; fbc.className='fb ok'; } onSolve(); return; }
          carveOut(ex); var cp=el('mCarvePlay'); if(cp && soloNotes.length) cp.hidden=false; return; }
        if(ex.checkMode==='chord' && soloNotes.length){ checkChordTones(ex); return; }
        if(ex.checkMode==='strongweak' && soloNotes.length){ checkStrongWeak(ex); return; }
        if(ex.mic && soloNotes.length){ checkSolo(ex); return; }
        var fb=el('fb2'); if(fb){ fb.textContent=ex.win; fb.className='fb ok'; } onSolve(); });
      if(ex.checkMode==='carve'){ el('mCarveCheck').addEventListener('click', checkCarve);
        el('mCarvePlay').addEventListener('click', function(){ playMelody(work, ex.bpm||92); }); }
    }
  }

  /* ===== course ===== */
  var COURSE = [
    { title:'Belt 1 — Melody & the Pentatonic', belt:'White Belt', lessons:[
      { num:'1.1', title:'A melody you already know', teach:[
          { html:"Welcome, little flyer. Before scales, before theory — you already carry melodies in your bones. Let's start with one everybody knows: <b>Mary Had a Little Lamb</b>." },
          { html:"Hit <b>Play</b> and just listen. Hear how it rises, falls, and <em>rests</em>. That shape is melody — and improvising begins right here, not with strange new notes but with a tune you can already hum." },
          { t:'qa', q:"That's it? A nursery rhyme?", a:"That's it. Every good solo is just a melody you invent as you go. Learn to hear a tune and bend it, and you're already flying. Give it a few listens." }
        ], ex:{ type:'melody', title:'Mary Had a Little Lamb', mel:MARY, bpm:100,
          desc:'Press Play and follow the note that lights up. This is our home melody for the whole belt. The letters under each note tell you its name.' } },
      { num:'1.2', title:'The major pentatonic', teach:[
          { html:"Here's the secret hiding in that tune: it uses only <b>five</b> notes. Gather them, line them up, and you have the <b>major pentatonic scale</b>." },
          { html:"In the key of C those five are <b>C · D · E · G · A</b>. No note in there can truly clash with another — which makes it the safest, sweetest sandbox in all of music to start improvising in." },
          { html:"Play the scale below and listen. Then play Mary again — <em>every</em> note she sings is one of these five. The melody was living inside the scale the whole time." }
        ], ex:{ type:'melody', title:'C major pentatonic', mel:CPENT, bpm:120,
          desc:'Five notes: C D E G A (then C on top and back down). Play it up and down until it sits in your ear.' } },
      { num:'1.3', title:'Make it your own', teach:[
          { html:"Time to <b>fly</b> a little. You know Mary, and you know she lives in the pentatonic. So here's the leap: change a few of her notes — to <em>other</em> notes in the scale — and she'll still sound good. That's the whole magic of the pentatonic." },
          { html:"On the staff below, four notes glow <b>blue</b> — those are yours. Tap one and it hops to the next note in the pentatonic; keep tapping to try them all. Each tap plays it, so you can hear your choice." },
          { t:'qa', q:"But what if I pick a bad one?", a:"There are no bad ones here — that's the point of the pentatonic sandbox. All five work. Change all four blue notes, hit Play, and listen to a melody that's now a little bit <em>yours</em>." }
        ], ex:{ type:'embellish', title:'Make it your own', mel:MARY_EMB, bpm:100,
          embWin:'That’s YOUR Mary now — and because you stayed in the pentatonic, every choice still sings. That, right there, is improvising. 🎉',
          desc:'The four blue notes are yours — tap each to move it to another pentatonic note (it plays as you tap). Change all four, then Play the whole tune and hear your version.' } },
      { num:'1.4', title:'Call & response', teach:[
          { html:"Music is a conversation. One phrase asks a <b>question</b>, the next gives an <b>answer</b> — that back-and-forth is <b>call and response</b>, the heartbeat of the blues, of jazz, of all of it." },
          { html:"You already know it. <b>Mary</b> herself is call and response: her first half hangs, unfinished — that's the <b>question</b>; her second half settles home — that's the <b>answer</b>. Tap “her question” and “her answer” below and hear the two halves." },
          { html:"Here's the trick. A <b>question</b> ends on a restless note — usually <b>degree 2</b> (D) or <b>degree 5</b> (G). Mary's question ends on the 5 — that <b>G</b> that leaves you waiting. The <b>answer</b> comes <b>home</b>, on <b>degree 1</b>, the tonic <b>C</b>." },
          { t:'qa', q:"So it's mostly the last note?", a:"The last note does the heavy lifting. End on the 2 or the 5 and the ear leans in for more; end on the 1 and it's settled. Now finish my little answer so it lands home on C." }
        ], ex:{ type:'answer', title:'Land it home', phrase:CR_PHRASE, split:4, bpm:96,
          desc:'First, hear Mary’s own question and answer above. Then: bar 1 is my question — it hangs. Bar 2 is your answer, and its last note is blue. Tap it until the whole thing lands home on C (degree 1), then hear Both.' } },
      { num:'1.5', title:'Answer me', teach:[
          { html:"Now we play for real. I'll ask a question — you won't see the notes, you'll just <em>hear</em> it. Then it's your turn: answer out loud, on your instrument, into the space." },
          { html:"No grading here, no wrong notes to fear — you've got the pentatonic, so you truly can't miss. One aim only: after my question hangs on the <b>2</b>, bring your answer <b>home to the 1</b> (C)." },
          { t:'qa', q:"And if my answer's rubbish?", a:"Then you call up another question and answer again — that's how every player who ever lived learned to talk. Trade a few with me, and when it feels natural, fly on." }
        ], ex:{ type:'freecall', title:'Trade fours', bpm:88,
          desc:'Turn on your mic, then tap “Hear a call” — a question you can’t see, ending on D. Answer it on your instrument in the four clicks that follow, landing home on C. The lab listens and cheers when you make it home. Wired headphones help.' } },
      { num:'1.6', title:'Your first flight', teach:[
          { html:"This is it — your first <b>flight</b>. Here's how players do it: first you play the <b>melody</b> (the “head”) over the chords, so everyone knows the tune. Then, on the repeat, you <b>improvise</b> — same chords, your own notes." },
          { html:"So: chorus one, play <b>Mary</b> over her chords. Chorus two, let go and fly — staying in the pentatonic. Then try it with a couple of other tunes you know." },
          { t:'qa', q:"Same chords, but I make up the melody?", a:"That's the whole game. The chords are the road; the head is one way down it; your solo is your own way. No wrong notes in the pentatonic — leave space, trade questions and answers, land home. Pick a tune and hit “Head, then solo.”" }
        ], ex:{ type:'jam', title:'Fly a chorus', bpm:96,
          desc:'Pick a tune. Chorus 1: play its melody (the head) over the chords. Chorus 2 and on: improvise with the pentatonic — space, call &amp; answer, land home. Try all three tunes when you’re ready.' } }
    ]},
    { title:'Belt 2 — The Blues', belt:'Yellow Belt', master:'blues', lessons:[
      { num:'2.1', title:'The blue note', teach:[
          { html:"Well, well. Your teacher sent word you'd be coming. <b>Papa Sonny</b>'s the name — been playing the blues on porches from New Orleans clear up to Memphis since before your teacher could hum. Pull up a chair, child." },
          { html:"The blues starts with one note. Take that pentatonic of yours and squeeze a new note in between the 2 and the 3: the <b>flat third</b> (in C, that's <b>E♭</b>). We call it the <b>blue note</b>." },
          { html:"By itself it sounds “wrong” — and that's exactly right. The magic is the <b>slide</b>: play E♭ and slither on up to E (the natural 3rd). That little cry, ♭3 → 3, <em>is</em> the sound of the blues." },
          { t:'qa', q:"So it's just one extra note?", a:"One note, and everything changes. Pentatonic plus that ♭3 is the <b>major blues scale</b>. Play it below — hear that E♭ lean into the E like a long Sunday sigh. Lean on that note and you're playing the blues, cher." }
        ], ex:{ type:'melody', title:'The major blues scale', mel:BLUESCALE, bpm:104,
          desc:'C D E♭ E G A — your pentatonic with the blue note (E♭) added. Play it up and down, and listen for the E♭ crying up into the E.' } },
      { num:'2.2', title:'Space & phrasing', teach:[
          { html:"Here's the mistake every beginner makes: playing <em>all the notes, all the time</em>. Listen to this busy little line — every single beat filled, one long run with nowhere to breathe." },
          { html:"Think of soloing like <b>talking</b>. You don't say every word in one breathless stream — you speak a <b>sentence</b>, then <b>breathe</b>, then say the next. A musical phrase is a sentence; a rest is the breath between." },
          { html:"But here's the trap: a rest between <em>every</em> note isn't phrasing — that's a <b>stutter</b>. Keep your notes together into a whole idea, <em>then</em> take the breath. B.B. King said more with one held phrase and a silence than most players say in a flurry." },
          { t:'qa', q:"So where do the breaths go?", a:"Between ideas, not between notes. In the line below, play a few notes that belong together — a sentence — then tap out the notes where you want to breathe before the next idea. Keep your sentences whole." }
        ], ex:{ type:'space', title:'Give it some air', phrase:BUSY, bpm:96,
          desc:'This line runs on every beat — no breath. Group it into <b>sentences</b>: keep a few notes in a row as one idea, then tap notes out to breathe before the next. A rest between every note is a stutter — keep your phrases whole.' } },
      { num:'2.3', title:'The 12-bar blues', teach:[
          { html:"One note gave you the blues sound. Now the <b>form</b> — the 12-bar road that nearly every blues in the world drives down. Twelve bars, three chords, then it loops. Learn it once and you can sit in anywhere — a porch in New Orleans, a club in Chicago." },
          { html:"It's built from three chords: the <b>I</b> (home — C7), the <b>IV</b> (F7), and the <b>V</b> (G7). Watch the grid light up: four bars of I, two of IV, back to I, then the <b>turnaround</b> — V, IV, I, V — which spins you round to the top again." },
          { t:'qa', q:"Do I have to memorise all twelve?", a:"You'll feel it faster than you'd think — it's the same shape every time. Hit Play, watch the bar light up, and count along: 1-2-3-4, 2-2-3-4… When you can feel where the IV and the V land, you own the form. Your blues scale sits over the <em>whole</em> thing." }
        ], ex:{ type:'bluesjam', title:'The 12-bar blues', chords:BLUES12, bpm:92,
          desc:'Twelve bars, three chords, looping forever. Press Play and watch each bar light up as it goes by — count along and feel the shape.',
          scaleName:'C major blues — C D E♭ E G A', goal:'Play it and count along. Bar 5 jumps up to the IV; the last two bars are the turnaround (V–IV–I–V) that sends you round again.',
          doneLabel:'I can feel the 12 bars', win:'That’s the form — twelve bars, looping forever. Now you can solo over it.' } },
      { num:'2.4', title:'Steal this lick', teach:[
          { html:"Every blues head carries a bag of <b>licks</b> — little ready-made phrases we mix and match. A lick is just a sentence you've said so often it plays itself. Here's one out of my own bag — go on and steal it." },
          { html:"Listen to bar 1: <b>G</b>, then the blue slide <b>E♭ → E</b>, back to <b>G</b>. That ♭3 → 3 curl is pure blues. Then a <b>breath</b> (there's your space from 2.2), and a little answer that lands home on <b>C</b>." },
          { t:'qa', q:"I can just copy it?", a:"That's how every player who ever lived learned — me included; I lifted mine off the old cats back home. Steal it, then bend it. Bar 1 is mine and stays put. The three green notes in the answer are <b>yours</b> — tap each to move it around the blues scale, then play the whole lick and make the answer your own." }
        ], ex:{ type:'embellish', title:'Steal this lick', mel:LICK, bpm:96, pal:BLUES_PAL,
          embWin:'That’s YOUR lick now — same blue curl, your own answer. Steal it, bend it, and it belongs to you. 🎉',
          desc:'Bar 1 is the classic blues curl — keep it. The three green notes in the answer are yours: tap each to move it through the blues scale, then Play the whole lick and hear your version.' } },
      { num:'2.5', title:'The minor blues', teach:[
          { html:"The blues has a darker side — the <b>minor blues</b>. And it's closer than you'd think, because every major key has a shadow: its <b>relative minor</b>, built on the 6th degree. The relative minor of <b>C</b> is <b>A minor</b> — the very same notes, heard from a moodier home." },
          { html:"So take the <b>A minor pentatonic</b> (A C D E G) and add a blue note — and here's the magic: that blue note is <b>still E♭</b>, the exact same note you leaned on in C. In C major blues it was the <b>♭3</b>; here in A minor it's the <b>♭5</b>. Same note, same cry <b>E♭ → E</b> — it just has a new job." },
          { t:'qa', q:"So it's the same notes?", a:"The same six notes as your C major blues scale — because A minor <em>is</em> the relative minor of C. You already know them; you're just making <b>A</b> home instead of C, and it turns moody. Play it below and hear your blues put on its dark coat." }
        ], ex:{ type:'melody', title:'The A minor blues scale', mel:ABLUES, bpm:100,
          desc:'A C D E♭ E G A — the A minor pentatonic (A C D E G) plus the blue note. It’s the same E♭ from C, but here it’s the ♭5 sliding up to E. Same six notes as the C major blues — new home, darker mood.' } },
      { num:'2.6', title:'Solo over the blues', teach:[
          { html:"Yellow-belt time. It all comes together now: the <b>form</b> (twelve bars), the <b>blue notes</b>, <b>space</b>, and <b>licks</b>. The 12-bar loop plays under you — and you solo over the whole thing." },
          { html:"No head to play this time — it's all you. Keep the rhythm dead simple: <b>one note per beat</b> (crotchets) and <b>rests</b> where you breathe. Lean on the <b>E♭ blue note</b>, leave plenty of space — and land your phrases <b>home on C</b> when the I comes round at the top." },
          { t:'qa', q:"A whole chorus, on my own?", a:"A whole chorus. Turn on the mic, hit Play, and take twelve bars — one note per beat, rests where you breathe. When you're done, tap “Check my solo” and I'll write your notes out and show you how many stayed in the pentatonic. Then the yellow belt is yours." }
        ], ex:{ type:'bluesjam', title:'Solo over the blues', chords:BLUES12, bpm:92, capstone:true, mic:true,
          desc:'The 12-bar blues loops under you — no head this time, just your solo. Play crotchets and rests (one note per beat), then check it back.',
          scaleName:'C blues — C D E♭ E G A (the E♭ is your blue note)',
          goal:'Enable the mic, hit Play, and solo — one note per beat, rests where you breathe. When you’re done, tap “Check my solo” to see your notes written out and how many stayed in the pentatonic.',
          doneLabel:'Check my solo 🎷', checkTail:'Yellow belt earned — that solo was yours. 🎷',
          win:'🎉 You soloed a full chorus over the blues — form, blue notes, space and all. Yellow belt earned!' } }
    ]},
    { title:'Belt 3 — Bluegrass', belt:'Green Belt', master:'appalachian', lessons:[
      { num:'3.1', title:'Up the mountain', teach:[
          { html:"Well howdy, young flyer! <b>Granny Mae</b>'s the name. Papa Sonny wired ahead — said you'd earned your yellow belt fair and square. Up here in the mountains we play <b>bluegrass</b>: fiddle tunes, fast flatpicking, and everybody gets a turn to shine." },
          { html:"Bluegrass lives in the key of <b>G</b>, and every jam starts the same way: somebody kicks off a tune everybody knows — the <b>head</b> — then we go round the circle and each picker makes it their own. Sound familiar? It's your head-then-solo game, played on a porch." },
          { t:'qa', q:"Do I need to know the tunes already?", a:"You'll learn 'em one at a time, same as everybody ever did. Start with the first tune every picker learns: <b>Boil Them Cabbage Down</b>. Play it below till you could hum it in your sleep — the jam moves quick, and knowing the head is your ticket in." }
        ], ex:{ type:'melody', title:'Boil Them Cabbage Down', mel:BOILEM, bpm:112,
          desc:'The first tune at every bluegrass jam — eight bars in the key of G. Learn the head cold: it leans on B, C and A, and comes home to G at the end.' } },
      { num:'3.2', title:'Same wings, new sky', teach:[
          { html:"Now, your solo notes. You know the <b>major pentatonic</b> from Belt 1 — five friendly notes, can't hit a wrong one. Here's the mountain secret: that shape isn't glued to C. Slide the whole thing up to <b>G</b> and you get <b>G A B D E</b> — the <b>G major pentatonic</b>." },
          { html:"Same wings, new sky. Every trick you've learned — space, call and answer, landing home — comes right along with you. The only thing that moves is <b>home</b>: up here, home is <b>G</b>." },
          { t:'qa', q:"So I already know how to fly here?", a:"That you do. Play the G pentatonic below till your ear finds the new home note. Next time you're up, I'll show you the runs every flatpicker keeps in their pocket." }
        ], ex:{ type:'melody', title:'G major pentatonic', mel:GPENT, bpm:120,
          desc:'G A B D E — the same five-note shape you know from C, moved up to a new home. Play it up and down till G feels like the ground under your feet.' } },
      { num:'3.3', title:'The G-run', teach:[
          { html:"Time you learned the most famous lick in all of bluegrass: the <b>G-run</b>. Lester Flatt stamped it on a thousand records, and every picker since keeps it in their pocket. It's how a mountain player says <em>“that's the end of my sentence.”</em>" },
          { html:"Here it is: <b>G A B G</b>, then climb home — <b>E F♯ G</b>. See that <b>F♯</b>? First sharp you've met — in the key of G it's a scale note, and it pulls up into G like a foot finding a stair." },
          { t:'qa', q:"When do I play it?", a:"At the end of a phrase, same place Papa Sonny taught you to breathe. Say your piece, take the breath, then <em>sign it</em> with the G-run. The three green notes below are your piece — move 'em where you like, then let the run do the talking." }
        ], ex:{ type:'embellish', title:'Sign it with the G-run', mel:GRUN, bpm:112, pal:GPSET, sharp:true,
          embWin:'There it is — your phrase, a breath, and the G-run signature. Play that at any jam on Earth and the pickers will nod. 🪕',
          desc:'Bar 1 is yours — tap the three green notes anywhere in the G pentatonic. Then the breath, then the famous run: G A B G, E F♯ G. The run stays put — it’s the signature.' } },
      { num:'3.4', title:'Round the keys', teach:[
          { html:"Here's the thing about a jam: nobody asks what key <em>you</em> like. The fiddler calls it — <b>G</b> today, <b>A</b> for the singer tomorrow, <b>C</b>, <b>D</b> or <b>E</b> the day after. Those five are the common calls, and a picker has to live in all of them." },
          { html:"But you already own the trick — you used it when C pentatonic became G pentatonic. <b>Shapes move.</b> The G-run is just degrees <b>1 2 3 1, then 6 7 1</b> — same stairs, different front door. Slide it to any key and it's the same signature." },
          { t:'qa', q:"Is it still called a G-run in the key of A?", a:"Ha — it is! Pickers call it the G-run wherever it lives; that's the joke and the badge. Tap each key below and play the run there. When all five feel like the same old friend, you're ready." }
        ], ex:{ type:'keyrun', title:'The run in five keys', keys:RUNKEYS, bpm:112,
          desc:'The same run — 1 2 3 1, 6 7 1 — in the five common bluegrass keys: G, C, D, A and E. Tap a key to hear it move in. Play all five to fly on.' } },
      { num:'3.5', title:'Old Joe Clark', teach:[
          { html:"Time for a proper second tune: <b>Old Joe Clark</b> — sung on porches since the 1800s, called at every jam since. And here's what's new: this one <b>runs</b>. It moves in <b>quavers</b> — two notes to every beat, the true bluegrass gait." },
          { html:"Don't let the crowd of notes spook you. Quavers are just walking with quicker feet — count <em>“one-and-two-and”</em> and they fall right in. Notice the little <b>flags</b> on the stems: that's how a quaver looks on the page." },
          { t:'qa', q:"That's twice the notes of Cabbage!", a:"It always looks like a lot till you hum it — and you've hummed this one all your life, I'd wager. Learn it a bar at a time. The Play button runs it over the chords, so you can pick along till it's yours." }
        ], ex:{ type:'melody', title:'Old Joe Clark (A part)', mel:OLDJOE, chords:OLDJOE_CH, bpm:100, sharp:true,
          desc:'The A part of Old Joe Clark in G — eight bars of quavers, straight from the fiddle-tune book. Play it over the chords and pick along; the F♯ is a scale note here, same as the G-run.' } },
      { num:'3.6', title:'Mine the tune', teach:[
          { html:"Now I'll tell you where licks <em>really</em> come from. Nobody invents them out of thin air — you <b>mine them out of tunes</b>. Every tune you know is a seam of licks waiting for a shovel." },
          { html:"Take Old Joe: that run in bar six — <b>D E D C, B A G A</b> — dig it out of the tune and it stands on its own. Drop it anywhere the G chord lives and it sounds like you've been picking for forty years." },
          { t:'qa', q:"Can I take licks from any tune?", a:"Any tune you can hum, cher— hm, that's Papa Sonny rubbing off on me. <em>Any tune at all.</em> Smart pickers write theirs down: there's a <b>Phrasebook</b> over in the Training hall for exactly that. Dig the lick below out of Old Joe, bend the ending, and it's yours." }
        ], ex:{ type:'embellish', title:'Dig a lick from Old Joe', mel:OJLICK, bpm:100, pal:GPSET, sharp:true,
          embWin:'Dug from the tune, bent into your own — that’s how a lick bag gets filled. Jot it in your Phrasebook before it flies off! 🪕',
          desc:'Bar 1 is mined straight out of Old Joe Clark’s sixth bar. Then a breath — and the ending is yours: tap the three green notes anywhere in the G pentatonic. Keep the licks you like in your <a href="phrasebook.html">Phrasebook</a>.' } },
      { num:'3.7', title:'Outline the changes', teach:[
          { html:"Now the deepest mountain secret. A bluegrass break isn't scale-wandering — the good ones <b>follow the chords</b>. Cabbage uses three: <b>G</b>, <b>C</b> and <b>D</b>, and each is a little family of notes: G is <b>G–B–D</b>, C is <b>C–E–G</b>, D is <b>D–F♯–A</b>." },
          { html:"A real break does it <b>in quavers</b> — the feet keep moving, and the first note of each bar lands <b>inside the new chord's family</b>. Do that one thing and your solo sounds like it knows the road. That's <b>outlining the changes</b>." },
          { t:'qa', q:"How do I know which chord is coming?", a:"Same way you know the next line of a song you've sung a hundred times — the form tells you. Listen to the break below: quavers all the way, and watch how every bar <em>opens</em> on its own chord. That downbeat note is the whole secret." }
        ], ex:{ type:'melody', title:'A break that knows the road', mel:OUTLINE8, chords:OUTLINE8_CH, bpm:96, sharp:true,
          desc:'Four bars of quavers over G, C, G, D — each bar opens inside its chord family (G–B–D, C–E–G, D–F♯–A), and the F♯ at the end pulls home to G. Play it a few times and hear the road in it.' } },
      { num:'3.8', title:'Play the changes', teach:[
          { html:"Your turn — and this time the <b>lab is listening</b>. Cabbage's eight bars loop below; you solo over them <b>in quavers</b>, two notes to the beat, aiming each bar at its chord family." },
          { html:"Don't chase perfect. Land the <b>first note of each bar</b> inside the chord, keep the feet moving, and breathe when you need to — the lab will write your break out afterwards and show you how it sat in the scale." },
          { t:'qa', q:"What if I fall off the road?", a:"Then you climb back on at the next bar — that's what every picker does. Take it round a few times, then check your break and look at it written out. Green means you knew the road." }
        ], ex:{ type:'bluesjam', exh:'The listening lab', title:'Play the changes', chords:BOILEM_CH, bpm:100, mic:true, sharp:true, grid:0.5,
          scalePcs:GMAJ_PCS, scaleLabel:'the G major scale', checkTail:'That’s a real bluegrass break — quavers that know the road. 🎻',
          desc:'Cabbage’s own eight bars, looping. Solo in quavers — two notes a beat, rests to breathe — and open each bar inside its chord: G–B–D, C–E–G, D–F♯–A.',
          scaleName:'G major — G A B C D E F♯ (every chord tone of G, C and D lives in here)',
          goal:'Enable the mic, hit Play, and take a break in quavers. Open each bar on a chord-family note. When you’re done, check your break — the lab writes it out in quavers.',
          doneLabel:'Check my break 🎻', win:'You followed the changes round the loop — that’s outlining, and your ear did the driving.' } },
      { num:'3.9', title:'The porch jam', teach:[
          { html:"Green-belt time — the <b>porch jam</b>. Here's how it goes: I kick off <b>Boil Them Cabbage Down</b>, everybody plays the head together, then we go round the circle and each picker takes a <b>break</b> — that's your solo. Pentatonic, chord families, and the G-run to sign off." },
          { html:"And fair warning: once everybody's had a turn, somebody always hollers <b>“kick it up!”</b> — same tune, but <em>fast</em>. Don't panic. Speed is just the same tune with the nerves taken out: play <b>half the notes</b>, leave twice the space, and let the G-run land." },
          { t:'qa', q:"What if I can't keep up?", a:"Then you grin and keep picking — nobody at a porch jam ever got thrown off the porch. Take the slow one first: head, then your break. When that feels good, call the fast one and hold on. Fly through both and the green belt's yours." }
        ], ex:{ type:'jam', exh:'Capstone', title:'The porch jam', bpm:112, sharp:true,
          tunes:[ { name:'Boil Them Cabbage Down', mel:BOILEM, chords:BOILEM_CH, bpm:112 },
                  { name:'Kick it up! 🔥', mel:BOILEM, chords:BOILEM_CH, bpm:152 } ],
          doneLabel:'I held my own 🪕', win:'🎉 Head, break, and the fast one — you held your own at the porch jam. Green belt earned!',
          desc:'Chorus 1: the head, all together. Then your break — pentatonic, chord families, G-run to sign off. When the slow one feels good, call “Kick it up!” and ride the fast one.' } }
    ]},
    { title:'Belt 4 — Jazz Blues', belt:'Blue Belt', master:'jazzcat', lessons:[
      { num:'4.1', title:'The 12 bars in a suit', teach:[
          { html:"Hey, kid. Pull up a stool. Granny Mae says you can pick, Papa Sonny says you can moan — so now you get the suit. Folks call me <b>the Cat</b>. If you ever learned to <em>walk</em> with me, you know I don't waste words." },
          { html:"Jazz took Papa Sonny's 12 bars and dressed 'em up three ways. Bar 2 jumps early to the IV — the <b>quick change</b>. Bar 8 borrows a little trouble on purpose: <b>A7</b>, the <b>VI7</b>. And bars 9–10 got civilized: <b>Dm7 to G7</b> — the <b>ii–V</b>, the most famous handshake in jazz." },
          { t:'qa', q:"It's still the blues though?", a:"Same road, better shoes. One more thing: real cats <em>lean</em> their quavers — that lope is called <b>swing</b>. We'll write everything straight on the page; you lean it on your instrument when your feet find it. Now count the form below till bar 8 stops surprising you." }
        ], ex:{ type:'bluesjam', exh:'The form', title:'The jazz blues', chords:JAZZ12, roman:JAZZ_ROMAN, bpm:96,
          desc:'Twelve bars in C, dressed up: quick change to F7 in bar 2, the A7 surprise in bar 8, and the ii–V (Dm7–G7) bringing you round. Play it and count.',
          scaleName:'C blues — C D E♭ E G A (and B♭ starts sneaking in over the 7th chords)',
          goal:'Count along: 1-2-3-4 each bar. Catch the quick change (bar 2), the A7 (bar 8), and the ii–V (bars 9–10).',
          doneLabel:'I can hear the new road', win:'That’s the jazz blues — same 12 bars, richer road. Every lesson in this belt drives down it.' } },
      { num:'4.2', title:'The seventh', teach:[
          { html:"In the mountains your chord families had three notes. In jazz every family adopts a fourth: the <b>seventh</b>. C7 is <b>C–E–G–B♭</b>. That B♭ — the <b>♭7</b> — is the sound of jazz the way E♭ was the sound of the blues." },
          { html:"Every chord in the form carries one: F7 has an <b>E♭</b>, G7 an <b>F</b>, A7 a <b>G</b>, Dm7 a <b>C</b>. Papa Sonny used blue notes as seasoning — in jazz, the ♭7 moves in permanent. Chord tones now come <b>four to a family</b>." },
          { t:'qa', q:"So I aim for four notes now instead of three?", a:"Four doors into every bar, kid — more ways in, not more ways wrong. Run the arpeggios below in straight quavers: C7, F7, G7, and land home. Get those under your fingers and the changes start playing <em>you</em>." }
        ], ex:{ type:'melody', title:'Seventh-chord arpeggios', mel:ARP7, chords:ARP7_CH, bpm:96,
          desc:'C7, F7 and G7 spelled out in straight quavers — up through the family (1 3 5 ♭7) and back down. Listen for the ♭7 leaning each chord forward.' } },
      { num:'4.3', title:'Approach tones', teach:[
          { html:"Now the jazz secret that scares people, made simple: <b>any note is legal if it's going somewhere</b>. The trick is the <b>approach tone</b> — a note one <b>half-step below</b> a chord tone, played on the way in." },
          { html:"Hear it in bar 1 below: <b>B slides into C</b>, <b>D♯ into E</b>, <b>F♯ into G</b>. Alone, those notes are strangers to the key. In motion, they're the lean that makes a line sound like jazz instead of a scale." },
          { t:'qa', q:"So wrong notes are… allowed?", a:"There are no wrong notes, kid — only notes that ain't going anywhere yet. Bar 2 is yours: three green notes sit in front of three landings. Tap each one till it sits exactly a half-step <em>below</em> the note it walks into, then play the line and feel the pull." }
        ], ex:{ type:'embellish', approach:true, title:'Slide in from below', mel:APPR, pal:CHROMA, sharp:true, bpm:96,
          desc:'Bar 1 shows it: B→C, D♯→E, F♯→G. Bar 2 is yours — tap each green note until it’s exactly one half-step below its landing, then Play and Check.' } },
      { num:'4.4', title:'Steal this lick', teach:[
          { html:"You stole from Papa Sonny, you dug licks out of Old Joe — now steal from the suit-wearers. Here's a <b>dominant-seventh lick</b>: it sings the <b>♭7</b> (there's your B♭) and steps down home like it owns the stairs." },
          { html:"Listen to bar 1: up the family — <b>E, G, B♭</b> — catch the <b>A</b>, then walk down <b>G, E, D, C</b>. Chord tones and steps, nothing fancy — that's why it works over <em>any</em> seventh chord you'll ever meet." },
          { t:'qa', q:"Any seventh chord?", a:"Hold that thought — it's next lesson. First make it yours: the breath comes, then three green notes. Bend the ending till it sounds like you, and jot the keeper in your Phrasebook. A jazz cat's bag is half stolen, half bent." }
        ], ex:{ type:'embellish', title:'A lick in a suit', mel:LICK7, pal:LICK7_PAL, bpm:96,
          embWin:'Stolen, bent, yours — that lick will pay your way into any jam with a 7th chord in it. Phrasebook it. 🎺',
          desc:'Bar 1 is the lick — up the C7 family, down the stairs to C. Then the breath, and the three green notes are your ending. Keep the keepers in your <a href="phrasebook.html">Phrasebook</a>.' } },
      { num:'4.5', title:'Move the lick round the form', teach:[
          { html:"Now the payoff. That lick isn't a C7 lick — it's a <b>dominant lick</b>, and the jazz blues is <em>full</em> of dominants. Slide the whole shape onto <b>F7</b> and it works in bars 5 and 6. Onto <b>G7</b> — bars 10 and 12. Onto <b>A7</b> — bar 8, the tricky one, handled." },
          { html:"Same stairs, four doors — Granny Mae taught you this trick with the G-run, round the keys. In jazz you move it round the <b>form</b>: one sentence, and suddenly you've got something to say in nearly every bar of the tune." },
          { t:'qa', q:"So one lick covers the whole blues?", a:"One lick, four addresses — that's a working musician's economy, kid. Tap each chord below and hear the lick move house. Play all four and it's in your fingers for good." }
        ], ex:{ type:'keyrun', exh:'Move the lick', title:'One lick, four doors', keys:LICK7KEYS, bpm:96,
          allDone:'Four doors, one lick — bars 1, 5, 8, 10 and 12, all covered by a single sentence. That’s how cats think. 🎺',
          desc:'The same lick built on each dominant of the form: C7 (bars 1–4), F7 (5–6), A7 (8), G7 (10 and 12). Tap each one to hear it move in. Play all four to fly on.' } },
      { num:'4.6', title:'The minor blues', teach:[
          { html:"One more room in the house: the <b>minor blues</b>. Take it back to <b>A minor</b> — Papa Sonny's dark twin key, same six notes you know. The form below is the 12-bar in a minor mood: <b>Am7</b> home, <b>Dm7</b> the iv, then <b>F7 to E7</b> bringing you round." },
          { html:"Now the lesson inside the lesson. Everything in this form is soft and minor — except the <b>V chord</b>. It stays <b>dominant</b>: <b>E7</b>, with a <b>G♯</b> in it. That G♯ is the <b>leading tone</b> — one bright, borrowed note whose only job is to <em>pull you home to A</em>." },
          { t:'qa', q:"Why not just keep the V minor too?", a:"Try it in your head — Em7 to Am7 just… strolls off. E7 to Am7 <em>arrives</em>. That half-step, G♯ up to A, is the strongest pull in music — the same lean as your approach tones, built right into the harmony. Loop the form and listen for the bright note in the dark room." }
        ], ex:{ type:'bluesjam', exh:'The minor form', title:'The minor blues in A', chords:AMINOR12, roman:AMIN_ROMAN, bpm:92,
          desc:'The 12-bar blues in a minor mood: Am7 home, Dm7 the iv, F7–E7 the turn. Every chord is dark except E7 — listen for its G♯ pulling home to A.',
          scaleName:'A minor blues — A C D E♭ E G, plus G♯ (the leading tone) over E7',
          goal:'Loop the form and count. When E7 lands (bars 10 and 12), listen for the G♯ — the one bright note, leaning hard into A.',
          doneLabel:'I can hear the G♯ pull home', win:'That’s the minor blues — and the leading tone is the whole engine of it. Dominant V, bright G♯, home to A.' } },
      { num:'4.7', title:'Tin Roof Blues', teach:[
          { html:"Capstone time, kid — and for that you learn a <b>real</b> tune. <b>Tin Roof Blues</b>, New Orleans Rhythm Kings, nineteen twenty-three. Older than me, and I've been on this stool a while. Papa Sonny's hometown, in a suit." },
          { html:"Look at the head: it's built on one slow, sly sentence — <b>G, G♭, F, E</b> — a chromatic slide, twice on the C7, then the <em>same sentence</em> moved up for the F7. And catch that <b>G♭</b>: Papa Sonny's dark blue note, walking down the stairs like it lives here." },
          { t:'qa', q:"It looks almost… easy?", a:"That's the deepest thing I'll tell you all belt: the tune is easy so the <em>feel</em> can be hard. Every note has room to mean something. Play it slow, over and over, till you stop reading and start <em>saying</em> it." }
        ], ex:{ type:'melody', title:'Tin Roof Blues (head)', mel:TINROOF, chords:JAZZ12, bpm:88,
          desc:'The 1923 head in C, over the jazz-blues form you learned in 4.1. One chromatic sentence — G G♭ F E — said on the I, said again, moved to the IV, then answered. Play it till you can hum it.' } },
      { num:'4.8', title:'How the tune breathes', teach:[
          { html:"Before you solo on a tune, you study how it <b>talks</b>. Listen again, and count the sentences. Bars 1–2: the sentence. Bars 3–4: <em>same sentence</em>. Bars 5–6: same sentence, <b>moved onto the IV</b> — the tune plays the lick-moving game from 4.5, forty years early." },
          { html:"Then bars 8–9: the melody climbs and <b>hangs</b> on one long A — a question left in the air. Bars 10–11 tumble down and <b>answer it home to C</b>. And bar 12? <b>Silence.</b> A whole bar of breath while the band turns the corner. The tune breathes exactly like Papa Sonny taught you to." },
          { t:'qa', q:"So it's call and response, sentences and breaths — all of it?", a:"Every trick you've learned since Belt 1, sitting in one 1923 chorus — that's <em>why</em> it's a classic. Play it once more and hear the phrasing, not the notes. Then we solo." }
        ], ex:{ type:'melody', title:'Listen for the phrases', mel:TINROOF, chords:JAZZ12, bpm:88,
          desc:'Same head, new ears. Count it: sentence (1–2), sentence again (3–4), sentence moved to the IV (5–6), the hang on A (8–9), the answer home to C (10–11), and a full bar of breath (12).' } },
      { num:'4.9', title:'The uptown jam', teach:[
          { html:"Blue-belt time. Here's how it goes uptown: the band plays the <b>head</b> of Tin Roof together, then you take your <b>chorus</b> — twelve bars, all yours, then the head takes it out. Tonight the middle belongs to you." },
          { html:"You know everything the tune needs: the form and its A7, four-note families, approach tones sliding in from below, one lick with four addresses, and phrasing that breathes. Say a sentence. Breathe. Move it. Land it home." },
          { t:'qa', q:"And if I get lost in the middle?", a:"Then you lay out till the top comes round — laying out <em>is</em> jazz, kid. Play the head, take your chorus, and when it feels like yours, step off the stand. The blue belt's waiting." }
        ], ex:{ type:'jam', exh:'Capstone', title:'The uptown jam', bpm:88,
          tunes:[ { name:'Tin Roof Blues', mel:TINROOF, chords:JAZZ12, bpm:88 } ],
          doneLabel:'That was my chorus 🎺', win:'🎉 Head, chorus, and out — you just soloed on a real jazz blues. Blue belt earned, kid. Wear the suit.',
          desc:'Chorus 1: the head, with the band. Chorus 2 on: your solo — families, approach tones, the lick round its four doors, and room to breathe. Mic on if you want to watch your notes.' } }
    ]},
    { title:'Belt 5 — The Jazz Standard', belt:'Black Belt', master:'jazzcat', lessons:[
      { num:'5.1', title:'The bandstand', teach:[
          { html:"Last belt, kid. Everything till now was the woodshed — this is the <b>bandstand</b>. And on a bandstand, the common language is the <b>standard</b>: a tune every player in every city already knows, so strangers can make music like old friends." },
          { html:"Ours is <b>Indiana</b> — 1917, older than the word “jazz” being respectable. Louis Armstrong opened shows with it half his life. It's <b>32 bars</b> instead of 12 — a longer road, but count it in four rows of eight and it's just four short stories." },
          { t:'qa', q:"Thirty-two bars is a lot of chords…", a:"And here's the sweet part — it's in <b>G</b>. Back home in the key Granny Mae gave you. <em>Back home again in Indiana</em>, you dig? Loop the form below and just count till the corners feel familiar." }
        ], ex:{ type:'bluesjam', exh:'The form', title:'Indiana — 32 bars', chords:INDIANA_CH, roman:IND_ROMAN, bpm:92,
          desc:'The full form: four 8-bar phrases. Watch the wheel bars (E7–A7–D7–G), the C→C♯dim stairstep, and the turn into Em near the end.',
          scaleName:'G major — G A B C D E F♯ (your Belt 3 home, dressed for town)',
          goal:'Loop it and count each row of eight. When bar 9’s C→C♯dim and bar 23’s Em stop surprising you, you know the road.',
          doneLabel:'I can count the form', win:'Thirty-two bars, four stories — and you can count your way round. That’s the map; now we learn the engine.' } },
      { num:'5.2', title:'The wheel', teach:[
          { html:"Now the engine under the hood. Indiana's A section runs <b>E7 → A7 → D7 → G</b>. Look at those roots: E, A, D, G — each one a <b>fifth below</b> the last. That's the <b>circle of fifths</b>, the wheel that turns half the songs ever written." },
          { html:"Every dominant seventh is a <b>lean</b> — it wants to fall a fifth. E7 leans on A7, A7 leans on D7, D7 leans on home. One push after another, all the way down to G. The tune isn't wandering; it's <em>rolling downhill home</em>." },
          { t:'qa', q:"So if I know where the wheel is, I always know what's next?", a:"That's the black-belt secret in one sentence, kid. Ride the arpeggios below — each bar is one turn of the wheel. Feel each chord hand you to the next." }
        ], ex:{ type:'melody', title:'Ride the wheel home', mel:WHEEL, chords:WHEEL_CH, bpm:96, sharp:true,
          desc:'E7, A7, D7, G — four arpeggios in quavers, each falling a fifth into the next. Play it till the pull home feels inevitable.' } },
      { num:'5.3', title:'Learn the head', teach:[
          { html:"Time to learn the tune itself — the whole 32, straight off the 1917 sheet. Good news: it's a <b>singer's melody</b>. Long notes, easy steps, room to breathe. Nothing here is fast; everything here is <em>placed</em>." },
          { html:"Watch for three landmarks as you play: the little chromatic slide <b>G–F♯–F♮</b> in bar 8, the held <b>A</b> that floats over bar 15, and the moody turn into <b>Em</b> after bar 22 — the relative-minor shadow you've known since Papa Sonny." },
          { t:'qa', q:"Do I have to learn ALL of it?", a:"Every note, kid — this one's your ticket for life. Play it over the changes, a row of eight at a time. When you can hum tomorrow's bar before it comes, you own it." }
        ], ex:{ type:'melody', title:'Indiana (head)', mel:INDIANA, chords:INDIANA_CH, bpm:92, sharp:true,
          desc:'The full 32-bar head in G, over the real changes. Learn it a row at a time — the staff scrolls. Landmarks: bar 8’s chromatic slide, bar 15’s long A, the Em shadow at bar 23.' } },
      { num:'5.4', title:'How the tune breathes', teach:[
          { html:"Same drill as Tin Roof: before you solo on a tune, study how it <b>talks</b>. Indiana breathes like a singer because it <em>was</em> sung: almost every phrase starts <b>after</b> beat one — a little breath first — and ends on a note held long enough to mean it." },
          { html:"Count the shape: a four-bar call that climbs, a four-bar answer that settles. Again. Then the long <b>A</b> hangs over the wheel like a question… and the last row walks it all home. And that <b>C♯dim stairstep</b>? The melody steps right up it — tension you can sing." },
          { t:'qa', q:"So the long notes ARE the phrasing?", a:"Now you're hearing it. A held note over moving chords is the cheapest magic in jazz — the floor moves, you stand still. Play it once more and listen for the breaths, not the notes. Then we go to work." }
        ], ex:{ type:'melody', title:'Listen for the breaths', mel:INDIANA, chords:INDIANA_CH, bpm:92, sharp:true,
          desc:'Same head, new ears: breaths before the phrases, long notes over moving chords, the climb up the C♯dim stairs, the Em shadow, the walk home.' } },
      { num:'5.5', title:'The ii–V–I', teach:[
          { html:"Now the most famous three words in jazz: <b>ii–V–I</b>. Modern cats take a plain V7 bar and split it — put its <b>ii</b> in front. In G: <b>Am7, then D7, then G</b>. Look at the chart from 5.1 — the subs are already pencilled over the D7 bars. Every jazz musician since bebop reads them there." },
          { html:"Why bother? Because ii–V–I is a <b>runway</b>: the smoothest possible glide home, two steps of lean and a landing. Learn ONE good lick over it and you've got a key that opens the last two bars of nearly every tune ever written." },
          { t:'qa', q:"So it's the jazz handshake?", a:"THE handshake. Here's mine: climb the Am7, catch D7 from its leading tone F♯, land square on <b>B — the 3rd of G</b>. Steal it, bend the ending, Phrasebook it. Next lesson we take it round the whole tune." }
        ], ex:{ type:'embellish', title:'The handshake lick', mel:LICK25, chords:LICK25_CH, pal:LICK25_PAL, bpm:92, sharp:true,
          embWin:'Climb the ii, ride the V, land on the 3rd — with your own ending. That lick is a skeleton key now. Phrasebook it. 🗝️',
          desc:'Bars 1–2 are the lick: up the Am7, down onto D7 from its F♯, landing on B — the 3rd of G. The breath, then three green notes: your ending. Keep it in your <a href="phrasebook.html">Phrasebook</a>.' } },
      { num:'5.6', title:'Fit it into the tune', teach:[
          { html:"A lick you can only play in one bar is a party trick. A lick you can land <b>anywhere</b> is vocabulary. Indiana's wheel means the same ii–V glide happens all over the tune — aimed at different homes." },
          { html:"So we move it: aim it <b>home to G</b> (bars 5–7), aim it <b>into D</b> (15–17), <b>into A7</b> (12–13) — same shape, new address, just like the G-run round the keys. And one door needs a bent key: aiming <b>into Em</b>, the landing drops a half-step to the minor 3rd. Same glide, darker room." },
          { t:'qa', q:"Transpose it… or bend it?", a:"Both — that's the craft. Major doors: slide the whole shape. The minor door: slide it AND flatten the landing. Tap every door below till the lick fits each one like it was written there." }
        ], ex:{ type:'keyrun', exh:'Every door in the tune', title:'One glide, four landings', keys:LICK25KEYS, bpm:92,
          allDone:'Home, D, A7, and the minor shadow — the same glide fits every corner of the tune, straight or bent. That’s vocabulary, not a trick. 🗝️',
          desc:'The handshake lick aimed at the tune’s doors: home to G, into D, into A7 — and into Em, where the landing bends down a half-step. Play all four.' } },
      { num:'5.7', title:'Guide tones', teach:[
          { html:"Here's how the pros never get lost in 32 bars: they don't track chords — they follow a <b>thread</b>. Every chord has one note that names it: the <b>3rd</b>. String the 3rds together and they walk bar to bar almost by step. That line is the <b>guide-tone line</b>." },
          { html:"Watch the A section: G's third is <b>B</b>… E7's is <b>G♯</b>… A7's is <b>C♯</b>… D7's is <b>F♯</b>… back to <b>B</b>. Half-steps and small slides, all the way round the wheel. Hang your solo on that thread and every bar names itself." },
          { t:'qa', q:"Just one note per chord?", a:"One <em>right</em> note, kid — remember Monk's pin. Below, bar 1 gives you B for free. The rest show each chord's <b>root</b> — tap each up to its <b>3rd</b> (count 1–3 up the family) and listen against the chord till the thread appears." }
        ], ex:{ type:'embellish', title:'Find the thread', mel:GUIDE, chords:GUIDE_CH, pal:CHROMA2, targets:GUIDE_TARGETS, bpm:92, sharp:true,
          desc:'One note per bar over the A section. Bar 1 is B — the 3rd of G. Every other bar starts on its chord’s ROOT: tap each note up until it’s the chord’s 3rd, and hear the guide-tone thread appear.' } },
      { num:'5.8', title:'The lab I — chord tones', teach:[
          { html:"Lab coat on — three sessions on the bandstand's own science. First: <b>chord tones only</b>. The loop plays the full 32; you solo using each bar's <b>family notes</b> — the lab knows which chord is under you, bar by bar, and checks every note against it." },
          { html:"Crotchets are fine here — this drill is about <b>choosing</b>, not running. Guide tones, arpeggio steps, roots when in doubt. Boring on purpose: this is the skeleton every great chorus hangs on." },
          { t:'qa', q:"No passing notes at all?", a:"Save 'em — they're next session. Chord tones read <b>green</b>, a stray scale note reads blue, outside reads red. Take a chorus and see how green you can make the page." }
        ], ex:{ type:'bluesjam', exh:'The listening lab', title:'Chord tones only', chords:INDIANA_CH, roman:IND_ROMAN, bpm:92, mic:true, sharp:true, checkMode:'chord',
          scalePcs:GMAJ_PCS, checkTail:'That’s the skeleton of a real chorus — bones first, flesh next.',
          desc:'The full 32 loops. Solo in chord tones — the lab knows the chord under every bar and grades each note against it: green = that bar’s family, blue = passing, red = outside.',
          scaleName:'Each bar’s chord family (the lab follows the changes with you)',
          goal:'Enable the mic, hit Play, and take a chorus in chord tones — crotchets are plenty. Then check: how green is your page?',
          doneLabel:'Check my chorus 🔬', win:'You walked the changes on family notes — the skeleton stands.' } },
      { num:'5.9', title:'The lab II — strong and weak', teach:[
          { html:"Session two — now we add motion. The rule of every great line: <b>strong beats anchor, weak beats travel</b>. Beats 1 and 3: land a <b>chord tone</b>. The beats between: <b>approach tones and passing notes</b>, sliding into the next landing." },
          { html:"That's the whole grammar of bebop in one sentence — anchor, travel, anchor, travel. Your 4.3 half-step approaches finally get their day job: they live on the weak beats, walking you into every strong one." },
          { t:'qa', q:"Quavers this time?", a:"Quavers, kid — anchor on the beat, travel on the “and”. The lab checks both: strong beats against the chord, travellers for whether they're actually going somewhere. Take it slow and let the grammar do the talking." }
        ], ex:{ type:'bluesjam', exh:'The listening lab', title:'Anchor and travel', chords:INDIANA_CH, roman:IND_ROMAN, bpm:88, mic:true, sharp:true, checkMode:'strongweak', grid:0.5,
          scalePcs:GMAJ_PCS, checkTail:'Anchor, travel, anchor — that’s the grammar of a jazz line.',

  function buildPages(teach){ var p=[]; teach.forEach(function(t){ if(t.t==='qa'){ p.push({who:'student',html:t.q}); p.push({who:'master',html:t.a}); } else p.push({who:'master',html:t.html}); }); return p; }
  function tokenize(html){ var t=[],i=0; while(i<html.length){ if(html[i]==='<'){ var j=html.indexOf('>',i); t.push({tag:html.slice(i,j+1)}); i=j+1; } else { t.push({ch:html[i]}); i++; } } return t; }
  function nChars(t){ var c=0; t.forEach(function(x){ if(!('tag' in x)) c++; }); return c; }
  var pages=[], pageIdx=0, dialogueDone=false, toks=[], shown=0, lineDone=false, typer=null;
  function renderType(){ var out='',c=0; toks.forEach(function(t){ if('tag' in t) out+=t.tag; else { if(c<shown) out+=t.ch; c++; } }); el('line').innerHTML=out+(lineDone?'':'<span class="cursor">▍</span>'); }
  function startType(html){ toks=tokenize(html); shown=0; lineDone=false; clearInterval(typer); renderType(); if(reduced){ finishLine(); return; } typer=setInterval(function(){ shown++; renderType(); if(shown>=nChars(toks)) finishLine(); }, 16); }
  function finishLine(){ clearInterval(typer); shown=nChars(toks); lineDone=true; renderType(); var last=pageIdx>=pages.length-1; el('cont').textContent=last?'▼ let’s play':'▼ tap to continue'; el('cont').classList.add('show'); }
  function showPage(){ var pg=pages[pageIdx]; var M=MASTERS[(LESSONS[idx]||{}).master]||MASTERS.teacher; el('scene').classList.toggle('student', pg.who==='student'); el('who').textContent=pg.who==='student'?'YOU':M.who; startType(pg.html); }
  function advance(){ if(dialogueDone) return; if(!lineDone){ finishLine(); return; } if(pageIdx<pages.length-1){ pageIdx++; showPage(); } else { dialogueDone=true; el('cont').classList.remove('show'); el('exwrap').hidden=false; } }

  /* ===== lesson / nav / toc ===== */
  function renderLesson(){ stopPlay(); stopMic(); stopJam(); stopBlues(); var L=LESSONS[idx];
    el('bk').textContent='LESSON '+L.num; el('btitle').textContent=L.title; el('belt').innerHTML='<span class="dot"></span>'+L.belt; el('pos').textContent='Lesson '+(idx+1)+' of '+LESSONS.length;
    el('portrait').innerHTML=(MASTERS[L.master]||MASTERS.teacher).svg;
    pages=buildPages(L.teach); pageIdx=0; dialogueDone=false; solved=false; work=null; el('scene').classList.remove('student');
    el('exwrap').hidden=true; el('exwrap').innerHTML=renderExercise(L.ex); wireExercise(L.ex);
    showPage(); renderNav(); buildToc(); window.scrollTo({top:0, behavior:reduced?'auto':'smooth'}); }
  function renderNav(){ el('prev').disabled=(idx===0); var L=LESSONS[idx], slot=el('nextslot');
    if(idx<LESSONS.length-1){
      if(paywalled(idx+1)){ slot.innerHTML='<button class="btn ink" id="goPro">🔒 Unlock the rest — Go Pro</button>'; el('goPro').addEventListener('click', openCoursePaywall); }
      else if(isGatedType(L.ex) && !solved && !isDone(idx)){ slot.innerHTML='<span class="endnote">Finish the exercise above, then fly on →</span>'; }
      else { slot.innerHTML='<button class="btn ink" id="next">Next →</button>'; el('next').addEventListener('click', function(){ markDone(idx); go(idx+1); }); } }
    else { slot.innerHTML='<span class="endnote">The end of the belt for now — more of the flight is being written. Come back soon.</span>'; } }
  function go(i){ i=Math.max(0,Math.min(LESSONS.length-1,i)); if(i>maxOpen()) return; if(paywalled(i)){ openCoursePaywall(); return; } idx=i; progress.last=idx; saveProgress(); renderLesson(); }
  function buildToc(){ var mo=maxOpen();
    var h=signedIn()?'<div class="synced">✓ Progress synced to your account</div>':'<div class="synced off">Saved on this device — <a id="syncSignin">sign in</a> to sync across devices</div>';
    COURSE.forEach(function(mod){ h+='<h4>'+mod.title+'</h4>';
      if(mod.lessons) mod.lessons.forEach(function(les){ var li=LESSONS.findIndex(function(x){ return x.num===les.num; });
        var done=isDone(li), pay=paywalled(li), locked=!pay && li>mo;
        var cls=[li===idx?'cur':'', pay?'pro':'', locked?'locked':'', done?'done':''].filter(Boolean).join(' ');
        var mark=done?'✓ ':(pay?'':(locked?'🔒 ':''));
        if(pay) h+='<a href="#" class="'+cls+'" data-pay="1">'+mark+les.num+' · '+les.title+'</a>';
        else if(locked) h+='<a class="'+cls+'">'+mark+les.num+' · '+les.title+'</a>';
        else h+='<a href="#" class="'+cls+'" data-go="'+li+'">'+mark+les.num+' · '+les.title+'</a>'; });
      else if(mod.soon) h+='<a class="soon">'+mod.blurb+' <span class="tag">soon</span></a>'; });
    var toc=el('toc'); toc.innerHTML=h;
    toc.querySelectorAll('[data-go]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); go(+a.dataset.go); toc.classList.add('hidden'); }); });
    toc.querySelectorAll('[data-pay]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); toc.classList.add('hidden'); openCoursePaywall(); }); });
    var si=el('syncSignin'); if(si) si.addEventListener('click', function(e){ e.preventDefault(); if(window.MAAuth && MAAuth.open) MAAuth.open('signin'); }); }

  /* ===== init ===== */
  el('speech').addEventListener('click', advance);
  el('tocBtn').addEventListener('click', function(){ el('toc').classList.toggle('hidden'); });
  el('prev').addEventListener('click', function(){ go(idx-1); });
  document.addEventListener('pointerdown', function(){ audio(); }, { once:true });
  idx=Math.min(progress.last||0, maxOpen());
  renderLesson();
  (function waitAuth(){ if(window.MAAuth && MAAuth.onChange) MAAuth.onChange(function(u){ if(u) cloudPull(); else cloudReady=false; buildToc(); }); else setTimeout(waitAuth,120); })();
  (function waitEnt(){ if(window.MAAuth && MAAuth.onEntitlements) MAAuth.onEntitlements(function(){ idx=Math.min(idx,maxOpen()); buildToc(); renderNav(); }); else setTimeout(waitEnt,120); })();
})();
</script>
